---
- name: Group hosts by OS
  hosts: all
  tasks:
    - name: Add hosts to OS groups
      ansible.builtin.group_by:
        key: >-
          {{ 'windows' if ansible_facts['os_family'] == 'Windows'
             else ('macos' if ansible_facts['os_family'] == 'Darwin'
             else 'ubuntu') }}
      changed_when: false

- name: Ubuntu bootstrap
  hosts: ubuntu
  pre_tasks:
    - name: Check for GUI session directories
      ansible.builtin.stat:
        path: "{{ item }}"
      register: gui_sessions
      loop:
        - /usr/share/xsessions
        - /usr/share/wayland-sessions

    - name: Automatically enable GUI apps if a desktop environment is detected
      ansible.builtin.set_fact:
        gui: true
      when:
        - not gui
        - not ('microsoft' in ansible_facts['kernel'] | lower)
        - gui_sessions.results | selectattr('stat.exists') | list | length > 0

  roles:
    - role: apt_update
    - role: setup_snap
    - role: setup_flatpak
    - role: setup_homebrew
    - role: tailscale

- name: Windows bootstrap
  hosts: windows
  roles:
    - role: setup_chocolatey

- name: Common tooling
  hosts: all
  roles:
    - role: docker
    - role: python
    - role: ai
    - role: zsh
    - role: tmux
    - role: aws
    - role: rclone
    - role: node
    - role: bw
    - role: mise
    - role: neovim
    - role: kubernetes
    - role: doppler
    - role: git
    - role: graphite
    - role: gui_apps
      when: gui | bool
