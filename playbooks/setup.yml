- name: Setup Development Environment
  hosts: local_machines
  vars:
    gui: false
    is_linux: "{{ ansible_facts['os_family'] != 'Darwin' }}"
    is_macos: "{{ ansible_facts['os_family'] == 'Darwin' }}"

  pre_tasks:
    - name: Check for GUI session directories
      ansible.builtin.stat:
        path: "{{ item }}"
      register: gui_sessions
      loop:
        - /usr/share/xsessions
        - /usr/share/wayland-sessions

    - name: Automatically enable GUI apps if a desktop environment is detected
      ansible.builtin.set_fact:
        gui: true
      when:
        - not gui
        - not ('microsoft' in ansible_facts['kernel'] | lower)
        - gui_sessions.results | selectattr('stat.exists') | list | length > 0

  roles:
    - role: docker
    - role: apt_update
      when: ansible_facts['distribution'] == 'Ubuntu'
    - role: setup_snap
    - role: setup_flatpak
    - role: setup_homebrew
    - role: python
    - role: ai
    - role: zsh
    - role: tmux
    - role: aws
    - role: rclone
    - role: node
    - role: bw
    - role: mise
    - role: neovim
    - role: kubernetes
    - role: doppler
    - role: tailscale
      when:
        - ansible_facts['os_family'] == 'Debian'
        - ansible_facts['distribution'] in ['Ubuntu', 'Debian']
    - role: git
    - role: graphite
    - role: gui_apps
      when: gui | bool
