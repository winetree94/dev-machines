---
- name: Group hosts by OS
  hosts: all
  # `always` because every later play targets a group built here. Without it a
  # tag-filtered run (`--tags docker`) would skip this play, leave ubuntu/macos/
  # windows empty and silently do nothing at all.
  tags: always
  tasks:
    # Fail before any role runs: the group_by below funnels every non-Windows,
    # non-macOS host into `ubuntu`, so an unsupported Linux would otherwise get
    # apt/snap tasks aimed at it and break halfway through the run.
    - name: Assert the host runs a supported OS
      ansible.builtin.assert:
        that:
          - >-
            ansible_facts['os_family'] in ['Windows', 'Darwin']
            or ansible_facts['distribution'] == 'Ubuntu'
        fail_msg: >-
          Unsupported OS: {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}
          ({{ ansible_facts['os_family'] }} family).
          Supported targets are Ubuntu, macOS and Windows.
        quiet: true

    - name: Add hosts to OS groups
      ansible.builtin.group_by:
        key: >-
          {{ 'windows' if ansible_facts['os_family'] == 'Windows'
             else ('macos' if ansible_facts['os_family'] == 'Darwin'
             else 'ubuntu') }}
      changed_when: false

- name: Ubuntu bootstrap
  hosts: ubuntu
  pre_tasks:
    - name: Check for GUI session directories
      ansible.builtin.stat:
        path: "{{ item }}"
      register: gui_sessions
      loop:
        - /usr/share/xsessions
        - /usr/share/wayland-sessions
      # `always` because the gui_enabled grouping downstream reads the `gui`
      # value this pair produces; skipping it would leave gui false and drop
      # every GUI role from a tag-filtered run.
      tags: always

    - name: Automatically enable GUI apps if a desktop environment is detected
      ansible.builtin.set_fact:
        gui: true
      when:
        - not gui
        - not ('microsoft' in ansible_facts['kernel'] | lower)
        - gui_sessions.results | selectattr('stat.exists') | list | length > 0
      tags: always

  roles:
    - role: apt_update
      tags: [apt_update]
    - role: snap
      tags: [snap]
    - role: flatpak
      tags: [flatpak]
    - role: homebrew
      tags: [homebrew]
    # Snapshot of the installed formulae/casks, consumed by every brew-backed
    # role in the later plays. Must come after `homebrew` so its dependencies
    # are in place, and before any play that reads the facts.
    - role: brew
      tags: [brew]

- name: MacOS bootstrap
  hosts: macos
  roles:
    # The Command Line Tools are the prerequisite for Homebrew and for every
    # role that compiles anything, so they have to land before Common tooling.
    # The role installs Xcode.app from the Mac App Store on top of them.
    - role: xcode
      tags: [xcode]
    # Snapshot of the installed formulae/casks - see the Ubuntu bootstrap play.
    - role: brew
      tags: [brew]

- name: Windows bootstrap
  hosts: windows
  roles:
    # Nothing to install - winget ships with the OS. Including the shared
    # winget role with no packages runs only its availability assert, so a host
    # without it fails once, up front, with a clear message.
    - role: winget
      tags: [winget]

- name: Group GUI-enabled hosts
  hosts: all
  # `always` for the same reason as the OS grouping play: the GUI applications
  # play targets gui_enabled, so skipping this would silently skip all of them.
  tags: always
  tasks:
    # `gui` is only final after the Ubuntu bootstrap play's desktop detection,
    # so this cannot be folded into the "Group hosts by OS" play at the top.
    # Grouping here keeps the GUI application roles gated by play targeting,
    # like the OS-exclusive bootstrap roles, instead of repeating a `when:` on
    # every one of them.
    - name: Add GUI hosts to the gui_enabled group
      ansible.builtin.group_by:
        key: gui_enabled
      when: gui | bool
      changed_when: false

- name: Common tooling
  hosts: all
  roles:
    # One role per piece of software, grouped by comment rather than by play:
    # extra plays cost a fact-gathering and connection round trip each, and the
    # role-ordering assertions in tests/validate_*.yml key off this play name.
    #
    # networking / containers
    - role: tailscale
      tags: [tailscale]
    - role: wireguard
      tags: [wireguard]
    - role: docker
      tags: [docker]
    # secrets
    - role: doppler
      tags: [doppler]
