- name: Setup Development Environment
  hosts: local_machines
  vars:
    gui: false
    is_linux: "{{ ansible_facts['os_family'] != 'Darwin' }}"
    is_macos: "{{ ansible_facts['os_family'] == 'Darwin' }}"
  roles:
    - role: apt-update
      when: ansible_facts['distribution'] == 'Ubuntu'
    - role: setup-snap
      when: ansible_facts['distribution'] == 'Ubuntu'
    - role: setup-flatpak
      when: ansible_facts['distribution'] == 'Ubuntu'
    - role: setup-homebrew
    - role: chezmoi
    - role: rust
    - role: python
    - role: ai
    - role: zsh
    - role: tmux
    - role: node
    - role: bw
    - role: neovim
    - role: kubernetes
    - role: docker
    - role: gui-apps
      when: gui
