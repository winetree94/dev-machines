---
- name: Group hosts by OS
  hosts: all
  # Windows hosts use OpenSSH, so their WinRM listener facts are unused. The
  # default collector waits ten seconds and warns when WinRM is disabled. The
  # smart gather action resolves through ansible.builtin.setup on every target;
  # POSIX setup treats an unknown negative subset as a harmless exclusion.
  module_defaults:
    ansible.builtin.setup:
      gather_subset:
        - "!winrm"
  # `always` because every later play targets a group built here. Without it a
  # tag-filtered run (`--tags docker`) would skip this play, leave ubuntu/macos/
  # windows empty and silently do nothing at all.
  tags: always
  tasks:
    # Fail before any role runs: the group_by below funnels every non-Windows,
    # non-macOS host into `ubuntu`, so an unsupported Linux or Ubuntu release
    # would otherwise get apt/snap tasks aimed at it and break halfway through
    # the run.
    - name: Assert the host runs a supported OS
      ansible.builtin.assert:
        that:
          - >-
            ansible_facts['os_family'] in ['Windows', 'Darwin']
            or (
              ansible_facts['distribution'] == 'Ubuntu'
              and ansible_facts['distribution_version'] is version('26.04', '>=')
            )
        fail_msg: >-
          Unsupported OS: {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}
          ({{ ansible_facts['os_family'] }} family).
          Supported targets are Ubuntu 26.04+, macOS and Windows.
        quiet: true

    - name: Determine the host OS group
      ansible.builtin.set_fact:
        detected_os_group: >-
          {{ 'windows' if ansible_facts['os_family'] == 'Windows'
             else ('macos' if ansible_facts['os_family'] == 'Darwin'
             else 'ubuntu') }}

    # Remote hosts need their static group before the first connection so its
    # shell and become settings apply. Catch a stale or swapped ansible_host
    # before an OS-exclusive bootstrap role runs against the wrong machine.
    - name: Assert the detected OS matches the static inventory group
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'localhost' or inventory_hostname in groups[detected_os_group]
        fail_msg: >-
          {{ inventory_hostname }} reports {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}
          ({{ ansible_facts['os_family'] }} family), so it must be declared in
          the {{ detected_os_group }} inventory group. Check ansible_host and
          the host's static group before re-running.
        quiet: true

    - name: Add hosts to OS groups
      ansible.builtin.group_by:
        key: "{{ detected_os_group }}"
      changed_when: false

    # Every WSL kernel carries the vendor tag - "microsoft-standard-WSL2" on
    # WSL2, "-Microsoft" on WSL1 - so one lowercase substring test covers both.
    # Read by the GUI detection below and by the VPN gate right after it.
    - name: Detect WSL
      ansible.builtin.set_fact:
        wsl: "{{ 'microsoft' in ansible_facts['kernel'] | lower }}"

    # A WSL guest has no network stack of its own: it is NATed behind the
    # Windows host, which is the machine that actually holds the VPN (managed
    # here as the remote `desktop` host). tailscaled inside the guest needs
    # systemd plus /dev/net/tun and then fights the host over the same routes,
    # so the VPN roles are off by default there. Override with `-e vpn=true`.
    - name: Disable the VPN roles on WSL
      ansible.builtin.set_fact:
        vpn: false
      when: wsl | bool

- name: Ubuntu bootstrap
  hosts: ubuntu
  environment: "{{ homebrew_environment }}"
  pre_tasks:
    - name: Check for GUI session directories
      ansible.builtin.stat:
        path: "{{ item }}"
      register: gui_sessions
      loop:
        - /usr/share/xsessions
        - /usr/share/wayland-sessions
      # `always` because the gui_enabled grouping downstream reads the `gui`
      # value this pair produces; skipping it would leave gui false and drop
      # every GUI role from a tag-filtered run.
      tags: always

    - name: Automatically enable GUI apps if a desktop environment is detected
      ansible.builtin.set_fact:
        gui: true
      when:
        - not gui
        # WSLg publishes no session desktop files, but keep the guard explicit:
        # a GUI installed in the guest would run against the Windows host's
        # desktop, which is provisioned as `desktop` instead.
        - not wsl | bool
        - gui_sessions.results | selectattr('stat.exists') | list | length > 0
      tags: always

  roles:
    - role: apt_update
      tags: [apt_update]
    # Straight after the cache refresh and before anything that builds or links
    # against them. The desktop_libs tag remains as a compatibility alias.
    - role: platform_prerequisites
      tags: [platform_prerequisites, desktop_libs]
    - role: snap
      tags: [snap]
    - role: flatpak
      tags: [flatpak]
    - role: homebrew
      tags: [homebrew]
    # Snapshot of the installed formulae/casks, consumed by every brew-backed
    # role in the later plays. Must come after `homebrew` so its dependencies
    # are in place, and before any play that reads the facts.
    - role: brew
      tags: [brew]

- name: MacOS bootstrap
  hosts: macos
  environment: "{{ homebrew_environment }}"
  roles:
    # The Command Line Tools are the prerequisite for Homebrew and for every
    # role that compiles anything, so they have to land before Common tooling.
    # The role installs Xcode.app from the Mac App Store on top of them.
    - role: xcode
      tags: [xcode]
    # No darwin.yml yet: the missing file is the intentional macOS no-op until
    # a non-application platform prerequisite is needed there.
    - role: platform_prerequisites
      tags: [platform_prerequisites]
    # Snapshot of the installed formulae/casks - see the Ubuntu bootstrap play.
    - role: brew
      tags: [brew]

- name: Windows bootstrap
  hosts: windows
  roles:
    # Nothing to install - winget ships with the OS. Including the shared
    # winget role with no packages runs only its availability assert, so a host
    # without it fails once, up front, with a clear message.
    - role: winget
      tags: [winget]
      vars:
        winget_global_update: true
    # No windows.yml yet. Future Windows prerequisites must use the shared
    # winget role from that file rather than invoking a package manager here.
    - role: platform_prerequisites
      tags: [platform_prerequisites]

- name: Group GUI-enabled hosts
  hosts: all
  # `always` for the same reason as the OS grouping play: the GUI applications
  # play targets gui_enabled, so skipping this would silently skip all of them.
  tags: always
  tasks:
    # `gui` is only final after the Ubuntu bootstrap play's desktop detection,
    # so this cannot be folded into the "Group hosts by OS" play at the top.
    # Grouping here keeps the GUI application roles gated by play targeting,
    # like the OS-exclusive bootstrap roles, instead of repeating a `when:` on
    # every one of them.
    - name: Add GUI hosts to the gui_enabled group
      ansible.builtin.group_by:
        key: gui_enabled
      when: gui | bool
      changed_when: false

- name: Common tooling
  hosts: all
  # The fact-derived mapping is empty on Windows, so the shared role list
  # dispatches to winget tasks without inheriting any Homebrew paths.
  environment: "{{ homebrew_environment }}"
  roles:
    # One role per piece of software, grouped by comment rather than by play:
    # extra plays cost a fact-gathering and connection round trip each, and the
    # role-ordering assertions in tests/validate_*.yml key off this play name.
    #
    # networking / containers
    - role: tailscale
      tags: [tailscale]
      when: vpn | bool
    - role: wireguard
      tags: [wireguard]
      when: vpn | bool
    - role: cloudflare_warp
      tags: [cloudflare_warp]
      when: vpn | bool
    - role: docker
      tags: [docker]
    - role: beszel_agent
      tags: [beszel_agent]
    # secrets
    - role: doppler
      tags: [doppler]
    - role: bitwarden_cli
      tags: [bitwarden_cli]
    - role: age
      tags: [age]
    - role: sops
      tags: [sops]
    # shell
    - role: zsh
      tags: [zsh]
    - role: direnv
      tags: [direnv]
    - role: fzf
      tags: [fzf]
    - role: tmux
      tags: [tmux]
    # editor
    - role: neovim
      tags: [neovim]
    - role: ripgrep
      tags: [ripgrep]
    - role: fd
      tags: [fd]
    # version control
    - role: git
      tags: [git]
    - role: git_lfs
      tags: [git_lfs]
    - role: gh
      tags: [gh]
    - role: delta
      tags: [delta]
    - role: lazygit
      tags: [lazygit]
    - role: dotweave
      tags: [dotweave]
    # languages and runtimes
    - role: mise
      tags: [mise]
    - role: python
      tags: [python]
    - role: rust
      tags: [rust]
    - role: bun
      tags: [bun]
    - role: pnpm
      tags: [pnpm]
    - role: biome
      tags: [biome]
    - role: java
      # Android's sdkmanager is a Java program. Keep the java tag for direct
      # runs, and inherit android so `--tags android` remains self-contained.
      tags: [java, android]
    # build tools
    - role: clang
      tags: [clang]
    - role: cmake
      tags: [cmake]
    - role: ninja
      tags: [ninja]
    - role: xvfb
      tags: [xvfb]
    # kubernetes
    - role: kubectl
      tags: [kubectl]
    - role: helm
      tags: [helm]
    - role: k9s
      tags: [k9s]
    - role: flux
      tags: [flux]
    - role: kubeseal
      tags: [kubeseal]
    - role: kubectl_cnpg
      tags: [kubectl_cnpg]
    - role: talosctl
      tags: [talosctl]
    - role: talhelper
      tags: [talhelper]
    # cloud and storage
    - role: awscli
      tags: [awscli]
    - role: rclone
      tags: [rclone]
    - role: syncthing
      tags: [syncthing]
    - role: postgresql_client
      tags: [postgresql_client]
    # mobile
    - role: android
      tags: [android]
    # AI CLI
    - role: claude_code
      tags: [claude_code]
    - role: codex
      tags: [codex]
    - role: copilot_cli
      tags: [copilot_cli]
    - role: opencode
      tags: [opencode]

- name: GUI applications
  # Empty when no host has gui enabled, in which case the play is skipped.
  hosts: gui_enabled
  environment: "{{ homebrew_environment }}"
  roles:
    # Fonts are kept as separate roles but share the `fonts` tag, so either
    # family can be managed alone and both can be refreshed in one targeted run.
    - role: agave_nerd_font
      tags: [agave_nerd_font, fonts]
    - role: d2coding
      tags: [d2coding, fonts]
    # AI desktop apps inherit their CLI tag so a targeted CLI run installs the
    # matching GUI on GUI-enabled hosts as well.
    - role: claude_desktop
      tags: [claude_desktop, claude_code]
    - role: chatgpt_desktop
      tags: [chatgpt_desktop, codex]
    - role: opencode_desktop
      tags: [opencode_desktop, opencode]
    - role: alacritty
      tags: [alacritty]
    - role: bitwarden_desktop
      tags: [bitwarden_desktop]
    - role: bottles
      tags: [bottles]
