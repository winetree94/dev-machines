- name: Setup Development Environment
  hosts: local_machines
  vars:
    gui: false
    is_linux: "{{ ansible_facts['os_family'] != 'Darwin' }}"
    is_macos: "{{ ansible_facts['os_family'] == 'Darwin' }}"

  pre_tasks:
    - name: Check for GUI session directories
      stat:
        path: "{{ item }}"
      register: gui_sessions
      loop:
        - /usr/share/xsessions
        - /usr/share/wayland-sessions

    - name: Automatically enable GUI apps if a desktop environment is detected
      set_fact:
        gui: true
      when:
        - gui == false
        - not ('microsoft' in ansible_facts['kernel'] | lower)
        - gui_sessions.results | selectattr('stat.exists') | list | length > 0

  roles:
    - role: docker
    - role: apt-update
      when: ansible_facts['distribution'] == 'Ubuntu'
    - role: setup-snap
    - role: setup-flatpak
    - role: setup-homebrew
    - role: python
    - role: fedora
    - role: ai
    - role: zsh
    - role: tmux
    - role: aws
    - role: rclone
    # - role: node
    - role: bw
    - role: mise
    - role: neovim
    - role: kubernetes
    - role: doppler
    - role: cloudflare-warp
    - role: git
    - role: graphite
    - role: gui-apps
      when: gui | bool
