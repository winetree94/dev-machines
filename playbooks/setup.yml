- name: Setup Development Environment
  hosts: local_machines
  vars:
    gui: false
    is_linux: "{{ ansible_facts['os_family'] != 'Darwin' }}"
    is_macos: "{{ ansible_facts['os_family'] == 'Darwin' }}"

  pre_tasks:
    - name: Check for GUI session directories
      stat:
        path: "{{ item }}"
      register: gui_sessions
      loop:
        - /usr/share/xsessions
        - /usr/share/wayland-sessions

    - name: Automatically enable GUI apps if a desktop environment is detected
      set_fact:
        gui: true
      when:
        - gui == false
        - not ('microsoft' in ansible_facts['kernel'] | lower)
        - gui_sessions.results | selectattr('stat.exists') | list | length > 0

    - name: Check for existing Cloudflare WARP APT source
      when: ansible_facts['distribution'] == 'Ubuntu'
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/cloudflare-client.list
      register: cloudflare_warp_apt_source

    - name: Repair unsupported Cloudflare WARP APT release
      when:
        - ansible_facts['distribution'] == 'Ubuntu'
        - ansible_facts['distribution_release'] == 'resolute'
        - cloudflare_warp_apt_source.stat.exists
      ansible.builtin.replace:
        path: /etc/apt/sources.list.d/cloudflare-client.list
        regexp: 'https://pkg\.cloudflareclient\.com/ resolute main'
        replace: 'https://pkg.cloudflareclient.com/ noble main'
      become: true

  roles:
    - role: docker
    - role: apt-update
      when: ansible_facts['distribution'] == 'Ubuntu'
    - role: setup-snap
    - role: setup-flatpak
    - role: setup-homebrew
    - role: python
    - role: fedora
    - role: ai
    - role: zsh
    - role: tmux
    - role: aws
    - role: rclone
    # - role: node
    - role: bw
    - role: mise
    - role: neovim
    - role: kubernetes
    - role: doppler
    - role: cloudflare-warp
    - role: tailscale
      when:
        - ansible_facts['os_family'] == 'Debian'
        - ansible_facts['distribution'] in ['Ubuntu', 'Debian']
    - role: git
    - role: graphite
    - role: vscode
      when:
        - ansible_facts['os_family'] == 'Debian'
        - ansible_facts['distribution'] in ['Ubuntu', 'Debian']
        - ansible_facts['architecture'] in ['x86_64', 'amd64']
        - gui | bool
    - role: gui-apps
      when: gui | bool
