[defaults]
inventory = ./inventories/hosts.yml

collections_path = ./collections
roles_path = ./roles_galaxy:./roles
become_plugins = ./plugins/become
vault_password_file = .vault_pass
interpreter_python = auto_silent
host_key_checking = false
retry_files_enabled = false

# Gather facts once per host per run instead of once per play. The default
# (implicit) re-ran the setup module in all 7 plays of playbooks/setup.yml,
# and a Windows gather costs 5.4s against 0.7s on Ubuntu. Safe here because
# every fact this repository reads is constant for the length of a run:
# os_family (the dispatcher in all 61 role main.yml files), env.HOME, user_id,
# distribution*, architecture, kernel and service_mgr. Nothing before the roles
# that consume env/user_id edits a profile or a login shell.
gathering = smart

# Per-task timings. Without them there is no way to tell an install that is
# genuinely slow from one that is merely waiting on a round trip - the whole
# reason the winget snapshot below exists.
callbacks_enabled = profile_tasks

# become_method is set per OS group in inventories/group_vars/
# (ubuntu: sudo_wrapped, macos: sudo, windows: runas)
#
# become is intentionally NOT enabled globally: roles opt in per task, and
# many tasks are deliberately unprivileged (Homebrew refuses to run as root).

[connection]
# Required by ansible_private_key (inventories/group_vars/all/main.yml):
# the key contents from the vault are loaded into a per-run ssh-agent.
ssh_agent = auto

[ssh_connection]
# Feed the module straight into the remote interpreter's stdin instead of
# writing it to a temp file first, which removes one round trip per task.
# Measured on ubuntu-dev: 6.51s -> 4.07s for five tasks (-37%). It makes no
# difference on the Windows host, where the cost is PowerShell start-up rather
# than the transfer, and it is a no-op for localhost's local connection.
#
# Compatible with the sudo_wrapped become plugin: that plugin subclasses the
# stock sudo plugin and only relaxes prompt matching, inheriting sudo's
# "-H -S -n" flags, which read the password from stdin and never need a tty.
# The one external requirement is no "Defaults requiretty" in the target's
# sudoers, which Ubuntu does not ship.
pipelining = True

# The default ControlPersist is 60s, short enough that a slow role lets the
# master connection expire and the next task pays a full SSH handshake again.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=600s
