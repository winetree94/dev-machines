[defaults]
inventory = ./inventories/hosts.yml

collections_path = ./collections
roles_path = ./roles_galaxy:./roles
become_plugins = ./plugins/become
vault_password_file = .vault_pass
interpreter_python = auto_silent
host_key_checking = false
retry_files_enabled = false

# become_method is set per OS group in inventories/group_vars/
# (ubuntu: sudo_wrapped, macos: sudo, windows: runas)
#
# become is intentionally NOT enabled globally: roles opt in per task, and
# many tasks are deliberately unprivileged (Homebrew refuses to run as root).

# ubuntu 26.04+ only
# become_exe = sudo.ws

[connection]
# Required by ansible_private_key (inventories/group_vars/all/main.yml):
# the key contents from the vault are loaded into a per-run ssh-agent.
ssh_agent = auto
