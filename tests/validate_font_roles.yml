---
- name: Validate font roles
  hosts: localhost
  gather_facts: false
  vars:
    roles_dir: "{{ playbook_dir }}/../roles"
    agave_dir: "{{ roles_dir }}/agave_nerd_font"
    d2coding_dir: "{{ roles_dir }}/d2coding"
    agave_defaults: >-
      {{ lookup('ansible.builtin.file', agave_dir ~ '/defaults/main.yml') }}
    agave_debian: >-
      {{ lookup('ansible.builtin.file', agave_dir ~ '/tasks/debian.yml') }}
    agave_darwin: >-
      {{ lookup('ansible.builtin.file', agave_dir ~ '/tasks/darwin.yml') }}
    agave_unix: >-
      {{ lookup('ansible.builtin.file', agave_dir ~ '/tasks/unix.yml') }}
    agave_windows: >-
      {{ lookup('ansible.builtin.file', agave_dir ~ '/tasks/windows.yml') }}
    agave_manifest_dir: >-
      {{ agave_dir }}/files/winget/NerdFonts.Agave/3.5.1
    agave_installer_manifest: >-
      {{ lookup('ansible.builtin.file', agave_manifest_dir ~ '/NerdFonts.Agave.installer.yaml') }}
    d2coding_defaults: >-
      {{ lookup('ansible.builtin.file', d2coding_dir ~ '/defaults/main.yml') }}
    d2coding_debian: >-
      {{ lookup('ansible.builtin.file', d2coding_dir ~ '/tasks/debian.yml') }}
    d2coding_darwin: >-
      {{ lookup('ansible.builtin.file', d2coding_dir ~ '/tasks/darwin.yml') }}
    d2coding_unix: >-
      {{ lookup('ansible.builtin.file', d2coding_dir ~ '/tasks/unix.yml') }}
    d2coding_windows: >-
      {{ lookup('ansible.builtin.file', d2coding_dir ~ '/tasks/windows.yml') }}
    d2coding_manifest_dir: >-
      {{ d2coding_dir }}/files/winget/NAVER.D2Coding/1.3.3
    d2coding_installer_manifest: >-
      {{ lookup('ansible.builtin.file', d2coding_manifest_dir ~ '/NAVER.D2Coding.installer.yaml') }}

  tasks:
    - name: Assert Agave pins and installs all official TTF variants
      ansible.builtin.assert:
        that:
          - "'agave_nerd_font_version: \"3.5.1\"' in agave_defaults"
          - "'Agave.tar.xz' in agave_defaults"
          - "'Agave.zip' in agave_defaults"
          - "agave_defaults | regex_findall('sha256:[0-9a-f]{64}') | length == 2"
          - "agave_defaults | regex_findall('AgaveNerdFont[^\\n]*\\.ttf') | length == 6"
          - "'ansible.builtin.get_url' in agave_unix"
          - "'ansible.builtin.command' in agave_unix"
          - "'argv:' in agave_unix"
          - "'-xJf' in agave_unix"
          - "'checksum:' in agave_unix"
          - "'.agave-nerd-font.version' in agave_unix"
          - "'notify: Refresh the user font cache' in agave_unix"

    - name: Assert Agave downloads directly on Ubuntu and macOS
      ansible.builtin.assert:
        that:
          - "'include_tasks: unix.yml' in agave_debian"
          - "'name: xz-utils' in agave_debian"
          - "'.local/share/fonts/AgaveNerdFont' in agave_debian"
          - "'include_tasks: unix.yml' in agave_darwin"
          - "'Library/Fonts' in agave_darwin"
          - "'community.general.homebrew' not in agave_darwin"

    - name: Assert D2Coding installs exactly the four requested TTF files
      ansible.builtin.assert:
        that:
          - "'d2coding_version: \"1.3.3\"' in d2coding_defaults"
          - "'d2coding_build: \"20260725\"' in d2coding_defaults"
          - "'D2Coding-Ver1.3.3-20260725.zip' in d2coding_defaults"
          - "d2coding_defaults | regex_findall('source: [^\\n]*\\.ttf') | length == 4"
          - "d2coding_defaults | regex_findall('target: [^\\n]*\\.ttf') | length == 4"
          - "'.ttc' not in d2coding_defaults | lower"
          - "'D2CodingLigature-Regular.ttf' in d2coding_defaults"
          - "'D2CodingLigature-Bold.ttf' in d2coding_defaults"
          - "'ansible.builtin.get_url' in d2coding_unix"
          - "'ansible.builtin.unarchive' in d2coding_unix"
          - >-
            d2coding_unix is search("map\\(attribute='source'\\)")
          - "'.d2coding.version' in d2coding_unix"
          - "'notify: Refresh the user font cache' in d2coding_unix"

    - name: Assert D2Coding downloads directly on Ubuntu and macOS
      ansible.builtin.assert:
        that:
          - "'include_tasks: unix.yml' in d2coding_debian"
          - "'name: unzip' in d2coding_debian"
          - "'.local/share/fonts/D2Coding' in d2coding_debian"
          - "'include_tasks: unix.yml' in d2coding_darwin"
          - "'Library/Fonts' in d2coding_darwin"
          - "'community.general.homebrew' not in d2coding_darwin"

    - name: Assert Windows uses user-scoped winget font manifests
      ansible.builtin.assert:
        that:
          - "'winget_local_packages' in agave_windows"
          - "'NerdFonts.Agave' in agave_windows"
          - "'winget_local_packages' in d2coding_windows"
          - "'NAVER.D2Coding' in d2coding_windows"
          - "'InstallerType: zip' in agave_installer_manifest"
          - "'NestedInstallerType: font' in agave_installer_manifest"
          - "'Scope: user' in agave_installer_manifest"
          - "agave_installer_manifest | regex_findall('RelativeFilePath: [^\\n]*\\.ttf') | length == 6"
          - "agave_installer_manifest | regex_findall('InstallerSha256: [0-9A-F]{64}') | length == 1"
          - "'InstallerType: zip' in d2coding_installer_manifest"
          - "'NestedInstallerType: font' in d2coding_installer_manifest"
          - "'Scope: user' in d2coding_installer_manifest"
          - "d2coding_installer_manifest | regex_findall('RelativeFilePath: [^\\n]*\\.ttf') | length == 4"
          - "'.ttc' not in d2coding_installer_manifest | lower"
          - "d2coding_installer_manifest | regex_findall('InstallerSha256: [0-9A-F]{64}') | length == 1"
