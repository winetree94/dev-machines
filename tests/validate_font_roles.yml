---
- name: Validate latest-release font roles
  hosts: localhost
  gather_facts: false
  vars:
    roles_dir: "{{ playbook_dir }}/../roles"
    agave_unix: "{{ lookup('file', roles_dir ~ '/agave_nerd_font/tasks/unix.yml') }}"
    agave_darwin: "{{ lookup('file', roles_dir ~ '/agave_nerd_font/tasks/darwin.yml') }}"
    agave_windows: "{{ lookup('file', roles_dir ~ '/agave_nerd_font/tasks/windows.yml') }}"
    agave_template: >-
      {{ lookup('file', roles_dir ~ '/agave_nerd_font/templates/winget/NerdFonts.Agave.installer.yaml.j2') }}
    d2coding_unix: "{{ lookup('file', roles_dir ~ '/d2coding/tasks/unix.yml') }}"
    d2coding_darwin: "{{ lookup('file', roles_dir ~ '/d2coding/tasks/darwin.yml') }}"
    d2coding_windows: "{{ lookup('file', roles_dir ~ '/d2coding/tasks/windows.yml') }}"
    d2coding_template: >-
      {{ lookup('file', roles_dir ~ '/d2coding/templates/winget/NAVER.D2Coding.installer.yaml.j2') }}

  tasks:
    - name: Assert Unix resolves latest checksummed font releases
      ansible.builtin.assert:
        that:
          - "'releases/latest' in agave_unix"
          - "'agave_nerd_font_latest_asset.digest' in agave_unix"
          - "'dev_machines_update_mode' in agave_unix"
          - "'releases/latest' in d2coding_unix"
          - "'d2coding_latest_asset.digest' in d2coding_unix"
          - "'d2coding_latest_build' in d2coding_unix"
          - "'.ttc' not in d2coding_unix | lower"

    - name: Assert macOS uses updateable Homebrew font casks
      ansible.builtin.assert:
        that:
          - "'font-agave-nerd-font' in agave_darwin"
          - "'font-d2coding' in d2coding_darwin"
          - "'community.general.homebrew_cask' in agave_darwin"
          - "'community.general.homebrew_cask' in d2coding_darwin"

    - name: Assert Windows renders dynamic checksum-pinned manifests
      ansible.builtin.assert:
        that:
          - "'releases/latest' in agave_windows"
          - "'manifest_templates' in agave_windows"
          - "'NestedInstallerType: font' in agave_template"
          - "'agave_nerd_font_latest_asset.digest' in agave_template"
          - "'releases/latest' in d2coding_windows"
          - "'manifest_templates' in d2coding_windows"
          - "'NestedInstallerType: font' in d2coding_template"
          - "'d2coding_latest_asset.digest' in d2coding_template"
          - "'.ttc' not in d2coding_template | lower"
