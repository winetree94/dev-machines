---
- name: Validate the latest stable JetBrains Toolbox role
  hosts: localhost
  gather_facts: false
  vars:
    role_dir: "{{ playbook_dir }}/../roles/jetbrains_toolbox"
    defaults: "{{ lookup('ansible.builtin.file', role_dir ~ '/defaults/main.yml') }}"
    debian: "{{ lookup('ansible.builtin.file', role_dir ~ '/tasks/debian.yml') }}"
    darwin: "{{ lookup('ansible.builtin.file', role_dir ~ '/tasks/darwin.yml') }}"
    windows: "{{ lookup('ansible.builtin.file', role_dir ~ '/tasks/windows.yml') }}"
  tasks:
    - name: Assert Ubuntu uses the official latest stable release API
      ansible.builtin.assert:
        that:
          - "'data.services.jetbrains.com/products/releases' in debian"
          - "'checksumLink' in debian"
          - "'dev_machines_update_mode' in debian"
          - "'.ansible-version' in debian"
          - "'.local/bin/jetbrains-toolbox' in debian"
          - "'.local/share/applications' not in debian"
          - "'jetbrains-toolbox --beta' not in debian"

    - name: Assert runtime dependencies and native managed channels remain
      ansible.builtin.assert:
        that:
          - "item in defaults"
          - "'name: jetbrains-toolbox' in darwin"
          - "'JetBrains.Toolbox' in windows"
      loop:
        - libxi6
        - libxrender1
        - libxtst6
        - mesa-utils
        - libfontconfig1
        - libgtk-3-bin
        - tar
        - dbus-user-session
        - libxcb-keysyms1
