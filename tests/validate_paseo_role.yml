---
- name: Validate the latest-release Paseo role
  hosts: localhost
  gather_facts: false
  vars:
    role_dir: "{{ playbook_dir }}/../roles/paseo"
    debian: "{{ lookup('ansible.builtin.file', role_dir ~ '/tasks/debian.yml') }}"
    darwin: "{{ lookup('ansible.builtin.file', role_dir ~ '/tasks/darwin.yml') }}"
    windows: "{{ lookup('ansible.builtin.file', role_dir ~ '/tasks/windows.yml') }}"
  tasks:
    - name: Assert Paseo follows the latest checksummed stable release
      ansible.builtin.assert:
        that:
          - "'releases/latest' in debian"
          - "'paseo_latest_asset.digest' in debian"
          - "'allow_downgrade: false' in debian"
          - "'name: paseo' in darwin"
          - "'releases/latest' in windows"
          - "'win_get_url' in windows"
          - "'checksum_algorithm: sha256' in windows"
          - "'New-ScheduledTaskPrincipal' in windows"
          - "'-LogonType Interactive' in windows"
          - "'winget uninstall' in windows"
