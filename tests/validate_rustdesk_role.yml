---
- name: Validate the latest-release RustDesk role
  hosts: localhost
  gather_facts: false
  vars:
    role_dir: "{{ playbook_dir }}/../roles/rustdesk"
    debian: "{{ lookup('ansible.builtin.file', role_dir ~ '/tasks/debian.yml') }}"
    darwin: "{{ lookup('ansible.builtin.file', role_dir ~ '/tasks/darwin.yml') }}"
    windows: "{{ lookup('ansible.builtin.file', role_dir ~ '/tasks/windows.yml') }}"
    installer: >-
      {{ lookup('ansible.builtin.file', role_dir ~ '/templates/winget/RustDesk.RustDesk.installer.yaml.j2') }}
  tasks:
    - name: Assert RustDesk follows official stable artifacts
      ansible.builtin.assert:
        that:
          - "'releases/latest' in debian"
          - "'rustdesk_latest_asset.digest' in debian"
          - "'armv7-sciter' in debian"
          - "'allow_downgrade: false' in debian"
          - "'name: rustdesk' in darwin"
          - "'releases/latest' in windows"
          - "'manifest_templates' in windows"
          - "'arp_version_regex' in windows"
          - "'InstallerType: wix' in installer"
          - "'Architecture: x64' in installer"
          - "'Architecture: arm64' in installer"
          - "'digest' in installer"
