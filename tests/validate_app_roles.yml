---
# One test for every per-application role, driven by the table below instead of
# one near-identical playbook per application. A missing OS key means the role must NOT carry a
# task file for that OS - that absence is the curation, so it is asserted just
# as strictly as the presence of the others.
- name: Validate per-application roles
  hosts: localhost
  gather_facts: false
  vars:
    roles_dir: "{{ playbook_dir }}/../roles"
    setup_playbook_path: "{{ playbook_dir }}/../playbooks/setup.yml"

    # AI CLI roles. The three cask-only tools have no Linux Homebrew package,
    # so debian.yml runs the vendor installer and the marker is its URL.
    ai_roles:
      - name: claude_code
        debian: https://claude.ai/install.sh
        darwin: claude-code
        windows: Anthropic.ClaudeCode
      - name: codex
        debian: https://chatgpt.com/codex/install.sh
        darwin: codex
        windows: OpenAI.Codex
      - name: copilot_cli
        debian: https://gh.io/copilot-install
        darwin: copilot-cli
        windows: GitHub.Copilot
      - name: opencode
        debian: brew.yml
        darwin: brew.yml
        windows: SST.opencode
        shared: brew.yml
        shared_contains: anomalyco/tap/opencode

    # GUI application roles: Ubuntu package marker, Homebrew cask token,
    # winget id. Ubuntu uses Flathub unless `debian_channel` says otherwise.
    gui_roles:
      - name: claude_desktop
        cli_tag: claude_code
        debian: "name: claude-desktop"
        debian_channel: apt_repository
        debian_repository: https://downloads.claude.ai/claude-desktop/apt/stable
        darwin: claude
        windows: Anthropic.Claude
      - name: chatgpt_desktop
        cli_tag: codex
        darwin: chatgpt
        windows: 9PLM9XGG6VKS
        windows_source: msstore
      - name: chrome
        debian: "name: google-chrome-stable"
        debian_channel: apt_repository
        debian_repository: https://dl.google.com/linux/chrome/deb
        darwin: google-chrome
        windows: Google.Chrome
      - name: opencode_desktop
        cli_tag: opencode
        debian: https://opencode.ai/download/stable/linux-x64-deb
        debian_channel: direct_deb
        debian_architecture_marker: "ansible_facts['architecture'] == 'x86_64'"
        darwin: opencode-desktop
        windows: SST.OpenCodeDesktop
      - name: bitwarden_desktop
        debian: com.bitwarden.desktop
        darwin: bitwarden
        windows: Bitwarden.Bitwarden
      - name: bottles
        debian: com.usebottles.bottles
      - name: discord
        debian: com.discordapp.Discord
        darwin: discord
        windows: Discord.Discord
      - name: flatseal
        debian: com.github.tchx84.Flatseal
      - name: freelens
        debian: app.freelens.Freelens
        darwin: freelens
        windows: Freelensapp.Freelens
      - name: gear_lever
        debian: it.mijorus.gearlever
      - name: gimp
        debian: org.gimp.GIMP
        darwin: gimp
        windows: GIMP.GIMP
      - name: headlamp
        debian: io.kinvolk.Headlamp
        darwin: headlamp
        windows: Headlamp.Headlamp
      - name: kitty
        debian: "name: kitty"
        debian_channel: apt
        darwin: kitty
      - name: jetbrains_toolbox
        debian: https://download.jetbrains.com/toolbox/
        debian_channel: direct_archive
        darwin: jetbrains-toolbox
        windows: JetBrains.Toolbox
      - name: libreoffice
        debian: org.libreoffice.LibreOffice
        darwin: libreoffice
        windows: TheDocumentFoundation.LibreOffice
      - name: microsoft_edge
        debian: com.microsoft.Edge
        darwin: microsoft-edge
      - name: moonlight
        debian: com.moonlight_stream.Moonlight
        darwin: moonlight
        windows: MoonlightGameStreamingProject.Moonlight
      - name: obsidian
        debian: md.obsidian.Obsidian
        darwin: obsidian
        windows: Obsidian.Obsidian
      - name: onlyoffice
        debian: org.onlyoffice.desktopeditors
        darwin: onlyoffice
        windows: ONLYOFFICE.DesktopEditors
      - name: parsec
        debian: com.parsecgaming.parsec
        darwin: parsec
        windows: Parsec.Parsec
        pkg: true
      - name: paseo
        debian: paseo_linux_download.url
        debian_channel: direct_deb
        debian_architecture_marker: "ansible_facts['architecture'] == 'x86_64'"
        darwin: paseo
        windows: GetPaseo.Paseo
        windows_source: local_manifest
      - name: pinta
        debian: com.github.PintaProject.Pinta
        darwin: pinta
        windows: Pinta.Pinta
      - name: redisinsight
        debian: com.redis.RedisInsight
        darwin: redis-insight
        windows: RedisInsight.RedisInsight
      - name: remmina
        debian: org.remmina.Remmina
      - name: rustdesk
        debian: rustdesk_linux_download.url
        debian_channel: direct_deb
        debian_architecture_marker: >-
          ansible_facts['architecture'] in rustdesk_linux_downloads
        darwin: rustdesk
        windows: RustDesk.RustDesk
        windows_source: local_manifest
      - name: slack
        debian: com.slack.Slack
        darwin: slack
        windows: SlackTechnologies.Slack
      - name: steam
        debian: com.valvesoftware.Steam
        darwin: steam
        windows: Valve.Steam
      - name: telegram
        debian: org.telegram.desktop
        darwin: telegram
        windows: Telegram.TelegramDesktop
      - name: thunderbird
        debian: org.mozilla.Thunderbird
        darwin: thunderbird
        windows: Mozilla.Thunderbird
      - name: vlc
        debian: org.videolan.VLC
        darwin: vlc
        windows: VideoLAN.VLC
      - name: vscode
        debian: "name: code"
        debian_channel: apt_repository
        debian_repository: https://packages.microsoft.com/repos/code
        darwin: visual-studio-code
        windows: Microsoft.VisualStudioCode
      - name: xclicker
        debian: xyz.xclicker.xclicker

    # macOS-only application roles. Karabiner-Elements is a keyboard driver
    # extension built on a macOS system extension - there is no Linux or
    # Windows counterpart to substitute, so the role has only darwin.yml. That
    # absence is the curation, and it is asserted below just as strictly as the
    # one file that must exist. `pkg: true` marks a cask whose artifact is a
    # .pkg installer rather than a drag-installed .app.
    macos_only_roles:
      - name: karabiner_elements
        darwin: karabiner-elements
        pkg: true

    # User-scoped fonts. Both official archives are installed directly on
    # Unix; Windows uses checked-in winget 1.12 font manifests because neither
    # family has a community-source package with the requested file set.
    font_roles:
      - name: agave_nerd_font
        debian: Agave.tar.xz
        darwin: Agave.tar.xz
        windows: NerdFonts.Agave
        windows_source: local_manifest
      - name: d2coding
        debian: D2Coding-Ver1.3.3-20260725.zip
        darwin: D2Coding-Ver1.3.3-20260725.zip
        windows: NAVER.D2Coding
        windows_source: local_manifest


    # CLI tool roles. `debian`/`darwin` are the Homebrew formula (or the apt
    # package where noted); a `shared` key means both OS files only include that
    # sub-file, and the package marker is asserted against the sub-file instead.
    cli_roles:
      # from the old kubernetes bundle
      - name: kubectl
        debian: kubernetes-cli
        darwin: kubernetes-cli
        windows: Kubernetes.kubectl
      - name: helm
        debian: helm
        darwin: helm
        windows: Helm.Helm
      - name: k9s
        debian: k9s
        darwin: k9s
        windows: Derailed.k9s
      - name: flux
        debian: brew.yml
        darwin: brew.yml
        windows: FluxCD.Flux
        shared: brew.yml
        shared_contains: fluxcd/tap/flux
      - name: talosctl
        debian: talosctl
        darwin: talosctl
        windows: Sidero.talosctl
      - name: talhelper
        debian: talhelper
        darwin: talhelper
        windows: talhelper.talhelper
      - name: age
        debian: age
        darwin: age
        windows: FiloSottile.age
      # sops, kubeseal and kubectl_cnpg have no usable winget package
      - name: sops
        debian: sops
        darwin: sops
      - name: kubeseal
        debian: kubeseal
        darwin: kubeseal
      - name: kubectl_cnpg
        debian: kubectl-cnpg
        darwin: kubectl-cnpg
      # from the old node bundle - none of these is Node.js, which mise manages
      - name: bun
        debian: brew.yml
        darwin: brew.yml
        windows: Oven-sh.Bun
        shared: brew.yml
        shared_contains: oven-sh/bun/bun
      - name: pnpm
        debian: pnpm
        darwin: pnpm
        windows: pnpm.pnpm
      - name: biome
        debian: biome
        darwin: biome
        windows: BiomeJS.Biome
      # Android's sdkmanager and terminal Gradle builds use this JDK. It is a
      # separate role so Java remains independently taggable and reusable.
      - name: java
        debian: openjdk-21-jdk
        darwin: openjdk@21
        windows: EclipseAdoptium.Temurin.21.JDK
      # split out of neovim
      - name: neovim
        debian: brew.yml
        darwin: brew.yml
        windows: Neovim.Neovim
        shared: brew.yml
        shared_contains: tree-sitter-cli
      - name: lazygit
        debian: lazygit
        darwin: lazygit
        windows: JesseDuffield.lazygit
      - name: ripgrep
        debian: ripgrep
        darwin: ripgrep
        windows: BurntSushi.ripgrep.MSVC
      - name: fd
        debian: fd
        darwin: fd
        windows: sharkdp.fd
      # split out of git. git itself is the one apt exception - see its debian.yml
      - name: git
        debian: "name: git"
        darwin: "name: git"
        windows: Git.Git
      - name: git_lfs
        debian: "name: git-lfs"
        darwin: git-lfs
        windows: GitHub.GitLFS
      - name: gh
        debian: gh
        darwin: gh
        windows: GitHub.cli
      - name: delta
        debian: git-delta
        darwin: git-delta
        windows: dandavison.delta
      # split out of zsh. zsh itself is preinstalled on macOS, so darwin.yml
      # only sets the login shell
      - name: zsh
        debian: "name: zsh"
        darwin: /bin/zsh
      - name: direnv
        debian: direnv
        darwin: direnv
        windows: direnv.direnv
      - name: fzf
        debian: fzf
        darwin: fzf
        windows: junegunn.fzf
      # roles converted off default.yml in the same change
      - name: bitwarden_cli
        debian: bitwarden-cli
        darwin: bitwarden-cli
        windows: Bitwarden.CLI
      - name: mise
        debian: mise
        darwin: mise
        windows: jdx.mise
      - name: rclone
        debian: rclone
        darwin: rclone
        windows: Rclone.Rclone
      - name: syncthing
        debian: "name: syncthing"
        darwin: syncthing
        windows: BillStewart.SyncthingWindowsSetup
      - name: graphite
        debian: brew.yml
        darwin: brew.yml
        shared: brew.yml
        shared_contains: withgraphite/tap/graphite
      - name: dotweave
        debian: brew.yml
        darwin: brew.yml
        windows: tinyrack.dotweave
        shared: brew.yml
        shared_contains: tinyrack-net/tap/dotweave
      - name: rust
        debian: rustup.yml
        darwin: rustup.yml
        windows: Rustlang.Rustup
        shared: rustup.yml
        shared_contains: https://sh.rustup.rs
      # Build and display tools available from the Ubuntu archive use apt
      # rather than Homebrew, so the Ubuntu marker is the apt package name.
      # macOS gets Apple Clang from the Xcode bootstrap and therefore
      # deliberately has no clang darwin.yml; Xvfb is Ubuntu-only.
      # On Windows the standalone packages are the only ones a plain
      # PowerShell session sees: Visual Studio's C++ workload bundles them,
      # but only inside a Developer Command Prompt, and this repository does
      # not manage Visual Studio.
      - name: clang
        debian: "name: clang"
        windows: LLVM.LLVM
      - name: cmake
        debian: "name: cmake"
        darwin: cmake
        windows: Kitware.CMake
      - name: ninja
        debian: "name: ninja-build"
        darwin: ninja
        windows: Ninja-build.Ninja
      - name: xvfb
        debian: "name: xvfb"

    app_roles: >-
      {{ ai_roles + cli_roles + gui_roles + macos_only_roles + font_roles }}
    # Everything that runs in the Common tooling play rather than the GUI one.
    common_roles: "{{ ai_roles + cli_roles }}"
    shared_roles: "{{ app_roles | selectattr('shared', 'defined') | list }}"
    debian_roles: "{{ app_roles | selectattr('debian', 'defined') | list }}"
    debian_absent: "{{ app_roles | rejectattr('debian', 'defined') | list }}"
    # GUI applications and the three AI CLIs are Homebrew casks; the rest of
    # the CLI roles are formulae or include a shared sub-file.
    cask_roles: >-
      {{ (ai_roles + gui_roles + macos_only_roles) | selectattr('darwin', 'defined')
         | rejectattr('shared', 'defined') | list }}
    flatpak_gui_roles: >-
      {{ gui_roles | selectattr('debian', 'defined')
         | rejectattr('debian_channel', 'defined') | list }}
    apt_repository_gui_roles: >-
      {{ gui_roles | selectattr('debian_channel', 'defined')
         | selectattr('debian_channel', 'equalto', 'apt_repository') | list }}
    direct_deb_gui_roles: >-
      {{ gui_roles | selectattr('debian_channel', 'defined')
         | selectattr('debian_channel', 'equalto', 'direct_deb') | list }}
    direct_archive_gui_roles: >-
      {{ gui_roles | selectattr('debian_channel', 'defined')
         | selectattr('debian_channel', 'equalto', 'direct_archive') | list }}
    apt_gui_roles: >-
      {{ gui_roles | selectattr('debian_channel', 'defined')
         | selectattr('debian_channel', 'equalto', 'apt') | list }}
    darwin_roles: "{{ app_roles | selectattr('darwin', 'defined') | list }}"
    darwin_absent: "{{ app_roles | rejectattr('darwin', 'defined') | list }}"
    windows_roles: "{{ app_roles | selectattr('windows', 'defined') | list }}"
    windows_absent: "{{ app_roles | rejectattr('windows', 'defined') | list }}"
    winget_windows_roles: >-
      {{ windows_roles | rejectattr('windows_source', 'defined') | list }}
    msstore_windows_roles: >-
      {{ windows_roles | selectattr('windows_source', 'defined')
         | selectattr('windows_source', 'equalto', 'msstore') | list }}
    local_manifest_windows_roles: >-
      {{ windows_roles | selectattr('windows_source', 'defined')
         | selectattr('windows_source', 'equalto', 'local_manifest') | list }}

  tasks:
    - name: Read the setup playbook
      ansible.builtin.set_fact:
        setup_playbook_content: "{{ lookup('ansible.builtin.file', setup_playbook_path) }}"

    - name: List every role directory
      ansible.builtin.find:
        paths: "{{ roles_dir }}"
        file_type: directory
        recurse: false
      register: role_dirs

    # --- the roles the split replaced -----------------------------------
    - name: Check the replaced roles are gone
      ansible.builtin.stat:
        path: "{{ roles_dir }}/{{ item }}"
      register: replaced_role_stats
      loop:
        - ai
        - gui_apps

    - name: Assert the replaced roles are gone
      ansible.builtin.assert:
        that:
          - replaced_role_stats.results | selectattr('stat.exists') | list | length == 0
          - >-
            '- role: ai\n' not in (setup_playbook_content ~ '\n')
          - "'- role: gui_apps' not in setup_playbook_content"
        fail_msg: >-
          roles/ai and roles/gui_apps were split into one role per application.
          Both directories and both setup.yml entries must be gone - a bundle
          role hides which OSes an application is actually managed on.

    - name: Check the second round of replaced roles is gone
      ansible.builtin.stat:
        path: "{{ roles_dir }}/{{ item }}"
      register: bundle_role_stats
      loop:
        - kubernetes
        - node

    - name: Assert the second round of replaced roles is gone
      ansible.builtin.assert:
        that:
          - bundle_role_stats.results | selectattr('stat.exists') | list | length == 0
          - "'- role: kubernetes' not in setup_playbook_content"
          - "'- role: node' not in setup_playbook_content"
        fail_msg: >-
          roles/kubernetes bundled ten unrelated tools and roles/node bundled
          four that were not Node.js. Both were split into one role per tool.

    - name: Find any default.yml left in the repository
      ansible.builtin.find:
        paths: "{{ roles_dir }}"
        patterns: default.yml
        recurse: true
      register: leftover_defaults

    - name: Assert no role anywhere defines a default.yml
      ansible.builtin.assert:
        that:
          - leftover_defaults.files | length == 0
        fail_msg: >-
          {{ leftover_defaults.files | map(attribute='path') | join(', ') }}
          must not exist. default.yml is the dispatcher's fallback on every OS,
          Windows included, so a role with one and no windows.yml runs Homebrew
          tasks on Windows. Give each supported OS its own file, or share one
          sub-file under another name when two of them are identical.

    - name: Check the shared mas role exists
      ansible.builtin.stat:
        path: "{{ roles_dir }}/mas/tasks/main.yml"
      register: mas_role_stat

    - name: Assert mas is installed once, through the shared role
      ansible.builtin.assert:
        that:
          - mas_role_stat.stat.exists
          - "'mas_installed' in mas_role"
          - >-
            xcode_main is search("include_role:[\s\S]{0,40}name: mas")
          - >-
            wireguard_darwin is search("include_role:[\s\S]{0,40}name: mas")
          - "'community.general.homebrew' not in xcode_main"
        fail_msg: >-
          roles/mas installs the mas formula and both roles that need it -
          xcode and wireguard - must include it rather than installing mas
          themselves. The mas_installed fact memoises it to one brew call per
          host, the same shape as winget_available in the shared winget role.
      vars:
        mas_role: "{{ lookup('ansible.builtin.file', roles_dir ~ '/mas/tasks/main.yml') }}"
        xcode_main: "{{ lookup('ansible.builtin.file', roles_dir ~ '/xcode/tasks/main.yml') }}"
        wireguard_darwin: "{{ lookup('ansible.builtin.file', roles_dir ~ '/wireguard/tasks/darwin.yml') }}"

    - name: Assert every role on disk is wired into the setup playbook
      ansible.builtin.assert:
        that:
          # The trailing newline anchors the match so "git" cannot satisfy
          # "github". lookup('file') strips the file's final newline, hence the
          # one added back on the right - otherwise the last role in the file
          # could never match. Parenthesised because the basename filter binds
          # tighter than ~ and would otherwise eat the whole concatenation.
          - >-
            ('- role: ' ~ (item.path | basename) ~ '\n')
            in (setup_playbook_content ~ '\n')
        fail_msg: >-
          roles/{{ item.path | basename }} is in no play in setup.yml, so it
          never runs. android and rust sat unwired for a long time exactly
          because nothing checked. The shared helper roles are excluded here
          because their callers include them instead.
      loop: >-
        {{ role_dirs.files
           | rejectattr('path', 'search', '/(mas|winget)$')
           | list }}
      loop_control:
        label: "{{ item.path | basename }}"

    # --- dispatcher ------------------------------------------------------
    - name: Check every application role has a dispatcher
      ansible.builtin.stat:
        path: "{{ roles_dir }}/{{ item.name }}/tasks/main.yml"
      register: main_stats
      loop: "{{ app_roles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Assert every application role has a dispatcher
      ansible.builtin.assert:
        that:
          - main_stats.results | rejectattr('stat.exists') | list | length == 0
        fail_msg: >-
          Every application role needs tasks/main.yml, the shared first_found
          OS dispatcher.

    - name: Assert each dispatcher holds no install logic
      ansible.builtin.assert:
        that:
          - "'ansible.builtin.include_tasks' in main_content"
          - "'with_first_found' in main_content"
          - "main_content is search(\"ansible_facts\\['os_family'\\] \\| lower\")"
          - "'ansible.builtin.apt' not in main_content"
          - "'community.general' not in main_content"
          - "'win_chocolatey' not in main_content"
        fail_msg: >-
          roles/{{ item.name }}/tasks/main.yml must be the first_found OS
          dispatcher only, with the install logic in debian.yml / darwin.yml /
          windows.yml.
      loop: "{{ app_roles }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        main_content: "{{ lookup('ansible.builtin.file', roles_dir ~ '/' ~ item.name ~ '/tasks/main.yml') }}"

    - name: Check no application role has a default.yml
      ansible.builtin.stat:
        path: "{{ roles_dir }}/{{ item.name }}/tasks/default.yml"
      register: default_stats
      loop: "{{ app_roles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Assert no application role has a default.yml
      ansible.builtin.assert:
        that:
          - default_stats.results | selectattr('stat.exists') | list | length == 0
        fail_msg: >-
          Application roles must not define tasks/default.yml. default.yml is
          also the dispatcher's fallback on Windows, so a Homebrew fallback
          would run there on any role without a windows.yml - the same reason
          roles/doppler has none.

    # --- Ubuntu ----------------------------------------------------------
    - name: Check every application role has a Debian task file
      ansible.builtin.stat:
        path: "{{ roles_dir }}/{{ item.name }}/tasks/debian.yml"
      register: debian_stats
      loop: "{{ debian_roles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Assert every application role has a Debian task file
      ansible.builtin.assert:
        that:
          - debian_stats.results | rejectattr('stat.exists') | list | length == 0
        fail_msg: >-
          Every application in this set is available on Ubuntu, so each role
          needs tasks/debian.yml. The only exceptions are macos_only_roles,
          which are checked the other way round just below.

    - name: Check the curated-out roles have no Debian task file
      ansible.builtin.stat:
        path: "{{ roles_dir }}/{{ item.name }}/tasks/debian.yml"
      register: debian_absent_stats
      loop: "{{ debian_absent }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Assert the curated-out roles have no Debian task file
      ansible.builtin.assert:
        that:
          - debian_absent_stats.results | selectattr('stat.exists') | list | length == 0
        fail_msg: >-
          These applications have no supported Ubuntu package. Leaving
          debian.yml out is what makes the dispatcher a no-op there; do not
          substitute a different application.

    # A third-party APT repository is allowed for a tool the Ubuntu archive
    # does not carry, but only added the way roles/tailscale and roles/doppler
    # do it: deb822_repository with signed_by pointing at a keyring fetched by
    # get_url. The deprecated apt-key and the old apt_repository module stay
    # banned outright, and none of the roles in this table needs a repository
    # at all - every one is in the archive, on Flathub, or ships an installer.
    - name: Assert no Debian task file adds an APT repository the deprecated way
      ansible.builtin.assert:
        that:
          - "'apt_repository' not in debian_content"
          - "'apt-key' not in debian_content"
          - "not ('deb822_repository' in debian_content and 'signed_by' not in debian_content)"
        fail_msg: >-
          roles/{{ item.name }}/tasks/debian.yml adds an APT repository with
          apt-key or the old apt_repository module, or adds an unsigned
          deb822_repository. Use deb822_repository with signed_by, the way
          roles/tailscale and roles/doppler do - and only for a tool the
          official Ubuntu archive does not carry.
      loop: "{{ debian_roles }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        debian_content: "{{ lookup('ansible.builtin.file', roles_dir ~ '/' ~ item.name ~ '/tasks/debian.yml') }}"

    - name: Assert each GUI role installs its Flathub application
      ansible.builtin.assert:
        that:
          - "'community.general.flatpak' in debian_content"
          - "'become: true' in debian_content"
          - item.debian in debian_content
        fail_msg: >-
          roles/{{ item.name }}/tasks/debian.yml must install {{ item.debian }}
          with community.general.flatpak. None of these applications has a
          Homebrew formula that works on Linux, so Flathub is the only route.
      loop: "{{ flatpak_gui_roles }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        debian_content: "{{ lookup('ansible.builtin.file', roles_dir ~ '/' ~ item.name ~ '/tasks/debian.yml') }}"

    - name: Assert each upstream APT GUI role uses a signed vendor repository
      ansible.builtin.assert:
        that:
          - "'ansible.builtin.get_url' in debian_content"
          - "'ansible.builtin.deb822_repository' in debian_content"
          - "'signed_by:' in debian_content"
          - item.debian_repository in debian_content
          - "'ansible.builtin.apt' in debian_content"
          - item.debian in debian_content
          - "'become: true' in debian_content"
        fail_msg: >-
          roles/{{ item.name }}/tasks/debian.yml must add the signed official
          vendor repository with get_url and deb822_repository, then install
          the package with apt.
      loop: "{{ apt_repository_gui_roles }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        debian_content: "{{ lookup('ansible.builtin.file', roles_dir ~ '/' ~ item.name ~ '/tasks/debian.yml') }}"

    - name: Assert each Ubuntu archive GUI role installs with apt
      ansible.builtin.assert:
        that:
          - "'ansible.builtin.apt' in debian_content"
          - item.debian in debian_content
          - "'state: present' in debian_content"
          - "'become: true' in debian_content"
          - "'deb822_repository' not in debian_content"
          - "'community.general.flatpak' not in debian_content"
        fail_msg: >-
          roles/{{ item.name }}/tasks/debian.yml must install {{ item.debian }}
          directly from the official Ubuntu archive with apt.
      loop: "{{ apt_gui_roles }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        debian_content: "{{ lookup('ansible.builtin.file', roles_dir ~ '/' ~ item.name ~ '/tasks/debian.yml') }}"

    - name: Assert Claude Desktop disables its duplicate package repository
      ansible.builtin.assert:
        that:
          - "'CLAUDE_DESKTOP_ADD_REPO=\\\"false\\\"' in claude_desktop_content"
          - "'claude-desktop.list' in claude_desktop_content"
          - "'deb822_repository' in claude_desktop_content"
        fail_msg: >-
          roles/claude_desktop/tasks/debian.yml must disable the repository
          added by the Claude Desktop package and keep only its Ansible-managed
          deb822 repository.
      vars:
        claude_desktop_content: "{{ lookup('ansible.builtin.file', roles_dir ~ '/claude_desktop/tasks/debian.yml') }}"

    - name: Assert each direct Debian GUI role uses the official package
      ansible.builtin.assert:
        that:
          - "'ansible.builtin.get_url' in debian_content"
          - "'ansible.builtin.apt' in debian_content"
          - "'deb:' in debian_content"
          - item.debian in debian_content
          - item.debian_architecture_marker in debian_content
          - "'become: true' in debian_content"
        fail_msg: >-
          roles/{{ item.name }}/tasks/debian.yml must download the official
          Debian package separately and install it with apt, while explicitly
          gating the architectures supported by that vendor package.
      loop: "{{ direct_deb_gui_roles }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        debian_content: "{{ lookup('ansible.builtin.file', roles_dir ~ '/' ~ item.name ~ '/tasks/debian.yml') }}"

    - name: Assert each direct archive GUI role verifies and extracts the vendor archive
      ansible.builtin.assert:
        that:
          - "'ansible.builtin.get_url' in debian_content"
          - item.debian in defaults_content
          - "'checksum:' in defaults_content"
          - "'architecture' in debian_content"
          - "'creates:' in debian_content"
          - "'state: link' in debian_content"
          - "'.local/share/applications' not in debian_content"
          - "'ansible.builtin.copy' not in debian_content"
          - "'ansible.builtin.template' not in debian_content"
          - "'become: false' in debian_content"
        fail_msg: >-
          roles/{{ item.name }} must download a checksum-pinned vendor archive,
          select it by target architecture, extract it idempotently, and leave
          desktop launcher creation to the application itself.
      loop: "{{ direct_archive_gui_roles }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        debian_content: "{{ lookup('ansible.builtin.file', roles_dir ~ '/' ~ item.name ~ '/tasks/debian.yml') }}"
        defaults_content: "{{ lookup('ansible.builtin.file', roles_dir ~ '/' ~ item.name ~ '/defaults/main.yml') }}"

    - name: Assert each AI role uses its documented Linux install path
      ansible.builtin.assert:
        that:
          - item.debian in debian_content
        fail_msg: >-
          roles/{{ item.name }}/tasks/debian.yml must install through
          {{ item.debian }}.
      loop: "{{ common_roles }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        debian_content: "{{ lookup('ansible.builtin.file', roles_dir ~ '/' ~ item.name ~ '/tasks/debian.yml') }}"

    - name: Assert the vendor installers are fetched, not piped into a shell
      ansible.builtin.assert:
        that:
          - "'ansible.builtin.get_url' in debian_content"
          - "'| bash' not in debian_content"
          - "'| sh' not in debian_content"
          - "'.stat.exists' in debian_content"
        fail_msg: >-
          roles/{{ item.name }}/tasks/debian.yml must download the official
          installer with get_url and run it as a separate task, guarded by a
          stat check so the role stays idempotent. Never pipe a download
          straight into a shell.
      loop: "{{ ai_roles | rejectattr('shared', 'defined') | list }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        debian_content: "{{ lookup('ansible.builtin.file', roles_dir ~ '/' ~ item.name ~ '/tasks/debian.yml') }}"

    - name: Check every shared Homebrew sub-file exists
      ansible.builtin.stat:
        path: "{{ roles_dir }}/{{ item.name }}/tasks/{{ item.shared }}"
      register: shared_stats
      loop: "{{ shared_roles }}"
      loop_control:
        label: "{{ item.name }}/{{ item.shared }}"

    - name: Assert every shared Homebrew sub-file exists
      ansible.builtin.assert:
        that:
          - shared_stats.results | rejectattr('stat.exists') | list | length == 0
        fail_msg: >-
          A role whose debian.yml and darwin.yml install the same thing shares
          one sub-file included from both, the way roles/neovim and
          roles/opencode do. It must not be called default.yml, which is also
          the dispatcher's fallback on Windows.

    - name: Assert each shared sub-file installs the expected package unprivileged
      ansible.builtin.assert:
        that:
          - item.shared_contains in shared_content
          - "'become: false' in shared_content"
        fail_msg: >-
          roles/{{ item.name }}/tasks/{{ item.shared }} must install
          {{ item.shared_contains }}, and every task in it stays unprivileged:
          Homebrew refuses to run as root and the vendor installers all write
          under $HOME.
      loop: "{{ shared_roles }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        shared_content: "{{ lookup('ansible.builtin.file', roles_dir ~ '/' ~ item.name ~ '/tasks/' ~ item.shared) }}"

    - name: Assert every third-party Homebrew tap is trusted
      ansible.builtin.assert:
        that:
          - "'trust: true' in shared_content"
        fail_msg: >-
          roles/{{ item.name }}/tasks/{{ item.shared }} taps a third-party
          repository, and Homebrew 6 refuses to load anything from an untrusted
          tap, so the tap task needs trust: true.
      loop: "{{ shared_roles }}"
      loop_control:
        label: "{{ item.name }}"
      when: "'homebrew_tap' in shared_content"
      vars:
        shared_content: "{{ lookup('ansible.builtin.file', roles_dir ~ '/' ~ item.name ~ '/tasks/' ~ item.shared) }}"

    # --- macOS -----------------------------------------------------------
    - name: Check the expected macOS task files exist
      ansible.builtin.stat:
        path: "{{ roles_dir }}/{{ item.name }}/tasks/darwin.yml"
      register: darwin_stats
      loop: "{{ darwin_roles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Assert the expected macOS task files exist
      ansible.builtin.assert:
        that:
          - darwin_stats.results | rejectattr('stat.exists') | list | length == 0
        fail_msg: >-
          Every role with a Homebrew cask needs tasks/darwin.yml.

    - name: Check the Linux-only roles have no macOS task file
      ansible.builtin.stat:
        path: "{{ roles_dir }}/{{ item.name }}/tasks/darwin.yml"
      register: darwin_absent_stats
      loop: "{{ darwin_absent }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Assert the Linux-only roles have no macOS task file
      ansible.builtin.assert:
        that:
          - darwin_absent_stats.results | selectattr('stat.exists') | list | length == 0
        fail_msg: >-
          Bottles, Flatseal, XClicker and Remmina have no Homebrew cask or
          formula - they are Linux-only projects. Leaving darwin.yml out is
          what makes the dispatcher a no-op on macOS; do not substitute a
          different application.

    - name: Assert each macOS task file installs the expected cask
      ansible.builtin.assert:
        that:
          - "'community.general.homebrew_cask' in darwin_content"
          - "'name: ' ~ item.darwin in darwin_content"
          - "'become: false' in darwin_content"
        fail_msg: >-
          roles/{{ item.name }}/tasks/darwin.yml must install the
          {{ item.darwin }} cask. Homebrew refuses to run as root, so the task
          stays unprivileged.
      loop: "{{ cask_roles }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        darwin_content: "{{ lookup('ansible.builtin.file', roles_dir ~ '/' ~ item.name ~ '/tasks/darwin.yml') }}"

    - name: Assert Git LFS is initialized for each target user
      ansible.builtin.assert:
        that:
          - "'filter.lfs.process' in git_lfs_initialize"
          - "'git-lfs filter-process' in git_lfs_initialize"
          - "'--skip-repo' in git_lfs_initialize"
          - "'--force' not in git_lfs_initialize"
          - "'changed_when: false' in git_lfs_initialize"
          - "'check_mode: false' in git_lfs_initialize"
          - "'become: false' in git_lfs_initialize"
          - "'filter.lfs.process' in git_lfs_windows"
          - "'git-lfs filter-process' in git_lfs_windows"
          - "'--skip-repo' in git_lfs_windows"
          - "'--force' not in git_lfs_windows"
          - "'GetEnvironmentVariable' in git_lfs_windows"
          - "'changed_when: false' in git_lfs_windows"
          - "'check_mode: false' in git_lfs_windows"
        fail_msg: >-
          Git LFS must initialize the target user's global filters exactly once,
          skip repository hook changes, preserve conflicting custom filters,
          and refresh the Windows process PATH after winget installation.
      vars:
        git_lfs_initialize: >-
          {{ lookup('ansible.builtin.file', roles_dir ~ '/git_lfs/tasks/initialize.yml') }}
        git_lfs_windows: >-
          {{ lookup('ansible.builtin.file', roles_dir ~ '/git_lfs/tasks/windows.yml') }}

    - name: Assert each CLI role's macOS file names the expected package
      ansible.builtin.assert:
        that:
          - item.darwin in darwin_content
        fail_msg: >-
          roles/{{ item.name }}/tasks/darwin.yml must install
          {{ item.darwin }}.
      loop: "{{ cli_roles | selectattr('darwin', 'defined') | list }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        darwin_content: "{{ lookup('ansible.builtin.file', roles_dir ~ '/' ~ item.name ~ '/tasks/darwin.yml') }}"

    - name: Assert only the pkg-based casks pass a sudo password
      ansible.builtin.assert:
        that:
          - ('sudo_password' in darwin_content) == (item.pkg | default(false))
        fail_msg: >-
          Only the casks marked `pkg: true` in the table above - parsec and
          karabiner_elements - need sudo_password: their artifact is a .pkg, so
          Homebrew shells out to "sudo installer" and an Ansible run has no
          terminal to prompt at. Plain .app casks are drag-installed and must
          not ask for the become password.
      loop: "{{ darwin_roles }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        darwin_content: "{{ lookup('ansible.builtin.file', roles_dir ~ '/' ~ item.name ~ '/tasks/darwin.yml') }}"

    # --- Windows ---------------------------------------------------------
    - name: Check the expected Windows task files exist
      ansible.builtin.stat:
        path: "{{ roles_dir }}/{{ item.name }}/tasks/windows.yml"
      register: windows_stats
      loop: "{{ windows_roles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Assert the expected Windows task files exist
      ansible.builtin.assert:
        that:
          - windows_stats.results | rejectattr('stat.exists') | list | length == 0
        fail_msg: >-
          Every role with a winget package needs tasks/windows.yml.

    - name: Check the curated-out roles have no Windows task file
      ansible.builtin.stat:
        path: "{{ roles_dir }}/{{ item.name }}/tasks/windows.yml"
      register: windows_absent_stats
      loop: "{{ windows_absent }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Assert the curated-out roles have no Windows task file
      ansible.builtin.assert:
        that:
          - windows_absent_stats.results | selectattr('stat.exists') | list | length == 0
        fail_msg: >-
          Bottles, Flatseal, XClicker and Remmina have no winget package,
          Karabiner-Elements is macOS-only, and Microsoft Edge is deliberately
          left alone on Windows: the winget
          manifest ships the Enterprise MSI while Windows 11 preinstalls the
          consumer build, so installing it fails with "the install technology
          is different from the current version installed". No windows.yml
          means the dispatcher is a no-op there, which is the intent.

    - name: Assert each community-source Windows task uses the shared winget role
      ansible.builtin.assert:
        that:
          - "'name: winget' in windows_content"
          - "'winget_packages' in windows_content"
          - "'- ' ~ item.windows in windows_content"
          - "'win_chocolatey' not in windows_content"
          - "'win_scoop' not in windows_content"
        fail_msg: >-
          roles/{{ item.name }}/tasks/windows.yml must include the shared
          winget role with {{ item.windows }}. Never call a package manager
          module directly from a windows.yml.
      loop: "{{ winget_windows_roles }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        windows_content: "{{ lookup('ansible.builtin.file', roles_dir ~ '/' ~ item.name ~ '/tasks/windows.yml') }}"

    - name: Assert each Microsoft Store task uses the shared winget role
      ansible.builtin.assert:
        that:
          - "'name: winget' in windows_content"
          - "'winget_msstore_packages' in windows_content"
          - "'- ' ~ item.windows in windows_content"
          - "'win_chocolatey' not in windows_content"
          - "'win_scoop' not in windows_content"
        fail_msg: >-
          roles/{{ item.name }}/tasks/windows.yml must include the shared
          winget role with Microsoft Store ID {{ item.windows }}.
      loop: "{{ msstore_windows_roles }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        windows_content: "{{ lookup('ansible.builtin.file', roles_dir ~ '/' ~ item.name ~ '/tasks/windows.yml') }}"

    - name: Assert each local manifest task uses the shared winget role
      ansible.builtin.assert:
        that:
          - "'name: winget' in windows_content"
          - "'winget_local_packages' in windows_content"
          - item.windows in windows_content
          - "'manifest_source' in windows_content"
          - "'win_chocolatey' not in windows_content"
          - "'win_scoop' not in windows_content"
        fail_msg: >-
          roles/{{ item.name }}/tasks/windows.yml must pass its checked-in
          local manifest to the shared winget role. A role must never download
          or execute a Windows installer directly.
      loop: "{{ local_manifest_windows_roles }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        windows_content: "{{ lookup('ansible.builtin.file', roles_dir ~ '/' ~ item.name ~ '/tasks/windows.yml') }}"

    # --- playbook wiring -------------------------------------------------
    - name: Assert the GUI grouping play sits between the bootstraps and the roles
      ansible.builtin.assert:
        that:
          - "'gui_enabled' in setup_playbook_content"
          - >-
            setup_playbook_content is search("Ubuntu bootstrap[\s\S]*Group
            GUI-enabled hosts[\s\S]*Common tooling[\s\S]*GUI applications")
        fail_msg: >-
          The "Group GUI-enabled hosts" play must run after the Ubuntu
          bootstrap play, which is where `gui` is auto-detected, and before the
          "GUI applications" play that targets the group it creates.

    - name: Assert every AI role runs in the Common tooling play
      ansible.builtin.assert:
        that:
          - >-
            setup_playbook_content is search("Common tooling[\s\S]*- role: "
            ~ item.name ~ "[\s\S]*GUI applications")
        fail_msg: >-
          Role {{ item.name }} is a CLI tool and belongs in the "Common
          tooling"
          play, which runs on every host.
      loop: "{{ ai_roles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Assert every GUI role runs in the GUI applications play
      ansible.builtin.assert:
        that:
          - >-
            setup_playbook_content is search("GUI applications[\s\S]*- role: "
            ~ item.name)
        fail_msg: >-
          Role {{ item.name }} must sit in the "GUI applications" play, which
          targets the gui_enabled group. Gating by play targeting is what keeps
          a `when: gui | bool` off every one of them.
      loop: "{{ gui_roles + macos_only_roles + font_roles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Assert the font roles share a targeted convenience tag
      ansible.builtin.assert:
        that:
          - >-
            setup_playbook_content is search("- role: " ~ item.name
            ~ "[\\s\\S]{0,80}tags: \\[" ~ item.name ~ ", fonts\\]")
        fail_msg: >-
          Role {{ item.name }} must carry both its own tag and the shared fonts
          tag so either family or the complete font set can be managed directly.
      loop: "{{ font_roles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Assert each AI desktop role inherits its CLI tag
      ansible.builtin.assert:
        that:
          - >-
            setup_playbook_content is search("- role: " ~ item.name
            ~ "[\\s\\S]{0,80}tags: \\[" ~ item.name ~ ", " ~ item.cli_tag ~ "\\]")
        fail_msg: >-
          Role {{ item.name }} must carry both its own tag and {{ item.cli_tag }}
          so a targeted CLI run installs the corresponding desktop app too.
      loop: "{{ gui_roles | selectattr('cli_tag', 'defined') | list }}"
      loop_control:
        label: "{{ item.name }}"
