---
- name: Validate winget role
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    winget_tasks_path: "{{ playbook_dir }}/../roles/winget/tasks/main.yml"
    winget_snapshot_path: "{{ playbook_dir }}/../roles/winget/tasks/snapshot.yml"
    winget_msstore_snapshot_path: "{{ playbook_dir }}/../roles/winget/tasks/snapshot_msstore.yml"
    winget_local_tasks_path: "{{ playbook_dir }}/../roles/winget/tasks/local.yml"
    winget_local_package_path: "{{ playbook_dir }}/../roles/winget/tasks/local_package.yml"
    winget_local_snapshot_path: "{{ playbook_dir }}/../roles/winget/tasks/snapshot_local.yml"
    winget_defaults_path: "{{ playbook_dir }}/../roles/winget/defaults/main.yml"
    setup_playbook_path: "{{ playbook_dir }}/../playbooks/setup.yml"
    requirements_path: "{{ playbook_dir }}/../requirements.yml"
    retired_bootstrap_roles:
      - setup_chocolatey
      - setup_scoop

  tasks:
    - name: Check the winget role files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: winget_task_stats
      loop:
        - "{{ winget_tasks_path }}"
        - "{{ winget_snapshot_path }}"
        - "{{ winget_msstore_snapshot_path }}"
        - "{{ winget_local_tasks_path }}"
        - "{{ winget_local_package_path }}"
        - "{{ winget_local_snapshot_path }}"
        - "{{ winget_defaults_path }}"

    - name: Assert the winget role files exist
      ansible.builtin.assert:
        that:
          - winget_task_stats.results | rejectattr('stat.exists') | list | length == 0
        fail_msg: >-
          roles/winget/tasks/main.yml and roles/winget/defaults/main.yml must exist.

    - name: Read the winget role files
      ansible.builtin.set_fact:
        winget_tasks: "{{ lookup('ansible.builtin.file', winget_tasks_path) }}"
        winget_defaults: "{{ lookup('ansible.builtin.file', winget_defaults_path) }}"
        winget_msstore_snapshot: >-
          {{ lookup('ansible.builtin.file', winget_msstore_snapshot_path) }}
        winget_local_tasks: >-
          {{ lookup('ansible.builtin.file', winget_local_tasks_path) }}
        winget_local_package: >-
          {{ lookup('ansible.builtin.file', winget_local_package_path) }}
        winget_local_snapshot: >-
          {{ lookup('ansible.builtin.file', winget_local_snapshot_path) }}
        setup_playbook_content: "{{ lookup('ansible.builtin.file', setup_playbook_path) }}"
        requirements_content: "{{ lookup('ansible.builtin.file', requirements_path) }}"

    - name: Assert the winget role installs only what is missing
      ansible.builtin.assert:
        that:
          - "'winget list --id' in winget_tasks"
          - "'winget install --id' in winget_tasks"
          - "'--exact' in winget_tasks"
          - "'winget_packages' in winget_tasks"
          - "'when: item.rc != 0' in winget_tasks"
          - "'failed_when: false' in winget_tasks"
        fail_msg: >-
          The winget role must probe each package with "winget list --exact" and install
          only the ones whose probe returned non-zero. "winget list" exits 0 when the
          package is installed and -1978335212 (0x8A150014) when it is not, and that
          exit code is the whole idempotency check.

    - name: Read the winget snapshot tasks
      ansible.builtin.slurp:
        src: "{{ winget_snapshot_path }}"
      register: winget_snapshot_raw

    - name: Decode the winget snapshot tasks
      ansible.builtin.set_fact:
        winget_snapshot: "{{ winget_snapshot_raw.content | b64decode }}"

    - name: Assert installed state comes from one snapshot per host
      ansible.builtin.assert:
        that:
          - "'winget export' in winget_snapshot"
          - "'winget_installed_ids' in winget_snapshot"
          - "'winget_installed_ids is not defined' in winget_tasks"
          - "'snapshot.yml' in winget_tasks"
          - >-
            winget_tasks is search("reject\\('in', winget_installed_ids\\)")
        fail_msg: >-
          Installed state must be answered from a single per-host "winget export"
          cached in winget_installed_ids, not one "winget list" per package. The round
          trip is the cost: an empty command on the Windows host takes 1.82s and a
          winget list takes 2.40s, so 49 roles asking individually spend ~118s. The
          snapshot must be guarded by "winget_installed_ids is not defined" so it runs
          once per host rather than once per including role.

    - name: Assert Microsoft Store state is snapshotted only when requested
      ansible.builtin.assert:
        that:
          - "'winget export' in winget_msstore_snapshot"
          - "'--source msstore' in winget_msstore_snapshot"
          - "'winget_msstore_installed_ids' in winget_msstore_snapshot"
          - "'winget_msstore_packages | length > 0' in winget_tasks"
          - "'winget_msstore_installed_ids is not defined' in winget_tasks"
          - "'snapshot_msstore.yml' in winget_tasks"
        fail_msg: >-
          Microsoft Store installed state must be exported once per host, and
          only when a caller requested at least one Store package.

    - name: Assert local manifests use one Add/Remove Programs snapshot
      ansible.builtin.assert:
        that:
          - "'winget_local_packages: []' in winget_defaults"
          - "'winget_local_packages | length > 0' in winget_tasks"
          - "'snapshot_local.yml' in winget_local_tasks"
          - "'winget_arp_installed_packages is not defined' in winget_local_tasks"
          - "'HKCU:' in winget_local_snapshot"
          - "'HKLM:' in winget_local_snapshot"
          - "'WOW6432Node' in winget_local_snapshot"
          - "'winget_arp_installed_packages' in winget_local_snapshot"
        fail_msg: >-
          Packages without a public source must share one cached snapshot of
          the per-user and machine Add/Remove Programs registry views.

    - name: Assert local manifests stay inside the shared winget workflow
      ansible.builtin.assert:
        that:
          - "'settings --enable LocalManifestFiles' in winget_local_tasks"
          - "'become: true' in winget_local_tasks"
          - "'win_tempfile' in winget_local_package"
          - "'win_copy' in winget_local_package"
          - "'winget validate --manifest' in winget_local_package"
          - "'install' in winget_local_package"
          - "'upgrade' in winget_local_package"
          - "'--manifest' in winget_local_package"
          - "'--silent' in winget_local_package"
          - "'--disable-interactivity' in winget_local_package"
          - "'Font already installed.' in winget_local_package"
          - "'ansible_check_mode' in winget_local_package"
          - "'win_file' in winget_local_package"
          - "'state: absent' in winget_local_package"
        fail_msg: >-
          Local packages must be validated and installed or upgraded through
          winget, predict changes in check mode, and always remove their copied
          manifest directory.

    - name: Assert the per-package probe survives as the fallback
      ansible.builtin.assert:
        that:
          - "'winget list --id' in winget_tasks"
          - "'winget_present.results | default([])' in winget_tasks"
        fail_msg: >-
          The per-package "winget list" must remain for the packages the export did not
          account for - an export only lists packages the source still carries a
          manifest for, so anything missing has to fall through to the old probe rather
          than be assumed absent. The install loop needs default([]) because the probe
          task is skipped outright when the snapshot covered every package.

    - name: Assert every winget operation pins its package source
      ansible.builtin.assert:
        that:
          - winget_tasks | regex_findall('--source winget') | length >= 2
          - winget_tasks | regex_findall('--source msstore') | length >= 2
          - "'--disable-interactivity' in winget_tasks"
          - "'--accept-source-agreements' in winget_tasks"
          - "'--accept-package-agreements' in winget_tasks"
        fail_msg: >-
          Every winget lookup and install must explicitly pin either the
          community winget source or Microsoft Store. Installs must remain
          non-interactive and accept the required source/package agreements.

    - name: Assert winget presence is asserted in the Windows bootstrap play
      ansible.builtin.assert:
        that:
          - "'winget --version' in winget_tasks"
          - "'ansible.builtin.assert' in winget_tasks"
          - "'winget_packages: []' in winget_defaults"
          - "'winget_msstore_packages: []' in winget_defaults"
          - "'winget_local_packages: []' in winget_defaults"
          - "'- role: winget' in setup_playbook_content"
          - >-
            setup_playbook_content is search("Windows bootstrap[\s\S]*- role: winget[\s\S]*Common tooling")
        fail_msg: >-
          The winget role must assert winget is present, and the "Windows bootstrap"
          play must include it with no packages so a host without winget fails once with
          a clear message instead of failing in every package role in turn. That needs
          both package inputs to default to empty lists.

    - name: Assert the winget availability check runs once per host
      ansible.builtin.assert:
        that:
          - "'winget_available' in winget_tasks"
          - >-
            winget_tasks is search("winget --version[\s\S]*when: not \\(winget_available \\| default\\(false\\)\\)")
          - >-
            winget_tasks is search("set_fact:[\s\S]*winget_available: true")
        fail_msg: >-
          Every role's windows.yml includes the winget role, so the availability check
          must be gated on a winget_available fact - otherwise it costs one extra WinRM
          round trip per including role instead of one per host.

    - name: Find every Windows task file
      ansible.builtin.find:
        paths: "{{ repo_root }}/roles"
        patterns: windows.yml
        recurse: true
      register: windows_task_files

    - name: Assert no Windows task file reaches for another package manager
      ansible.builtin.assert:
        that:
          - "'win_chocolatey' not in windows_task_content"
          - "'win_scoop' not in windows_task_content"
        fail_msg: >-
          {{ item.path | relpath(repo_root) }} must install through the shared winget
          role. Chocolatey and Scoop are both retired here: choco only tracks its own
          installs and fails with MSI 1603 over anything else, and Scoop does not
          register in Add/Remove Programs so winget cannot see what it installed.
      loop: "{{ windows_task_files.files }}"
      loop_control:
        label: "{{ item.path | relpath(repo_root) }}"
      vars:
        windows_task_content: "{{ lookup('ansible.builtin.file', item.path) }}"

    - name: Check the retired bootstrap roles are gone
      ansible.builtin.stat:
        path: "{{ repo_root }}/roles/{{ item }}"
      register: retired_role_stats
      loop: "{{ retired_bootstrap_roles }}"

    - name: Assert the retired bootstrap roles are gone
      ansible.builtin.assert:
        that:
          - retired_role_stats.results | selectattr('stat.exists') | list | length == 0
        fail_msg: >-
          {{ retired_bootstrap_roles | join(' and ') }} must be deleted - nothing
          installs through Chocolatey or Scoop any more.

    - name: Check the standalone winget bootstrap role is gone
      ansible.builtin.stat:
        path: "{{ repo_root }}/roles/setup_winget"
      register: setup_winget_stat

    - name: Assert the standalone winget bootstrap role is gone
      ansible.builtin.assert:
        that:
          - not setup_winget_stat.stat.exists
        fail_msg: >-
          roles/setup_winget was merged into the shared winget role - its availability
          assert now lives in roles/winget/tasks/main.yml, so there is only one winget
          role to include.

    - name: Assert the retired collections are no longer required
      ansible.builtin.assert:
        that:
          - "'chocolatey.chocolatey' not in requirements_content"
          - "'community.windows' not in requirements_content"
          - "'ansible.windows' in requirements_content"
        fail_msg: >-
          requirements.yml must not pull chocolatey.chocolatey or community.windows any
          more; the winget role only needs ansible.windows.
