---
- name: Validate inventory sources every credential from the vault
  hosts: localhost
  gather_facts: false
  vars:
    hosts_path: "{{ playbook_dir }}/../inventories/hosts.yml"
    group_vars_main_path: "{{ playbook_dir }}/../inventories/group_vars/all/main.yml"
    vault_path: "{{ playbook_dir }}/../inventories/group_vars/all/vault.yml"
    legacy_all_path: "{{ playbook_dir }}/../inventories/group_vars/all.yml"
    ansible_cfg_path: "{{ playbook_dir }}/../ansible.cfg"
    yamllint_path: "{{ playbook_dir }}/../.yamllint"
    setup_playbook_path: "{{ playbook_dir }}/../playbooks/setup.yml"
    # Derived from the live inventory, never hardcoded: adding, renaming or
    # commenting out a host in inventories/hosts.yml must not break this test.
    # localhost is excluded - it carries no ansible_host and is grouped at runtime.
    managed_hosts: "{{ groups['all'] | difference(['localhost']) | sort }}"
    os_groups:
      - ubuntu
      - macos
      - windows

  tasks:
    - name: Check inventory and vault files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: inventory_secret_files
      loop:
        - "{{ hosts_path }}"
        - "{{ group_vars_main_path }}"
        - "{{ vault_path }}"

    - name: Assert inventory and vault files exist
      ansible.builtin.assert:
        that:
          - inventory_secret_files.results | selectattr('stat.exists') | list | length == 3
        fail_msg: >-
          inventories/hosts.yml, inventories/group_vars/all/main.yml and
          inventories/group_vars/all/vault.yml must all exist.

    - name: Check the superseded group_vars/all.yml is gone
      ansible.builtin.stat:
        path: "{{ legacy_all_path }}"
      register: legacy_all_file

    - name: Assert group_vars/all.yml does not shadow group_vars/all/
      ansible.builtin.assert:
        that:
          - not legacy_all_file.stat.exists
        fail_msg: >-
          inventories/group_vars/all.yml must not coexist with the
          inventories/group_vars/all/ directory.

    # Note: lookup('ansible.builtin.file', ...) transparently decrypts vault
    # files, so the raw ciphertext is checked with a slurp instead.
    - name: Read vault file header
      ansible.builtin.slurp:
        src: "{{ vault_path }}"
      register: vault_raw

    - name: Assert the vault file is encrypted at rest
      ansible.builtin.assert:
        that:
          - (vault_raw.content | b64decode).startswith('$ANSIBLE_VAULT;1.1;AES256')
        fail_msg: inventories/group_vars/all/vault.yml must be an ansible-vault encrypted file.

    - name: Read inventory and config files
      ansible.builtin.set_fact:
        hosts_content: "{{ lookup('ansible.builtin.file', hosts_path) }}"
        group_vars_main_content: "{{ lookup('ansible.builtin.file', group_vars_main_path) }}"
        ansible_cfg_content: "{{ lookup('ansible.builtin.file', ansible_cfg_path) }}"
        yamllint_content: "{{ lookup('ansible.builtin.file', yamllint_path) }}"
        setup_playbook_content: "{{ lookup('ansible.builtin.file', setup_playbook_path) }}"

    # Guards against the derived list going empty and silently turning the
    # per-host assertions below into no-ops.
    - name: Assert the inventory still declares remote hosts
      ansible.builtin.assert:
        that:
          - managed_hosts | length > 0
        fail_msg: >-
          inventories/hosts.yml declares no host besides localhost; the
          per-host assertions in this test would pass vacuously.

    - name: Assert every managed host is declared with vault-sourced credentials
      ansible.builtin.assert:
        that:
          - >-
            hosts_content is search(item ~ ':\\s*\\n\\s*ansible_host:[^\\n]*\\n\\s*ansible_user:
            "\\{\\{ vault_[^\\n]*\\n\\s*ansible_become_password: "\\{\\{ vault_')
        fail_msg: >-
          {{ item }} must be declared in inventories/hosts.yml with ansible_host,
          and with ansible_user and ansible_become_password sourced from vault_* variables.
      loop: "{{ managed_hosts }}"

    - name: Assert no credential is written in plain text in the inventory
      ansible.builtin.assert:
        that:
          - "hosts_content is not search('ansible_become_password:\\s*[^\"\\s]')"
          - "hosts_content is not search('ansible_become_password:\\s*\"(?!\\{\\{ vault_)')"
          - "hosts_content is not search('(?m)^\\s*ansible_password:')"
          - "'ansible_ssh_private_key_file' not in hosts_content"
        fail_msg: >-
          inventories/hosts.yml must reference vault_* variables only, must not
          enable SSH password auth, and must not point at an on-disk key file.

    - name: Assert the SSH key is supplied from the vault as contents
      ansible.builtin.assert:
        that:
          - "group_vars_main_content is search('ansible_private_key: \"\\{\\{ vault_ssh_private_key \\}\\}\"')"
          - "'ansible_ssh_private_key_file' not in group_vars_main_content"
        fail_msg: >-
          group_vars/all/main.yml must map vault_ssh_private_key onto
          ansible_private_key and must never reference a key file on disk.

    - name: Assert the Dotweave age identity is supplied from the vault
      ansible.builtin.assert:
        that:
          - >-
            group_vars_main_content is search(
              'dotweave_age_identity: "\\{\\{ vault_dotweave_age_identity \\}\\}"'
            )
        fail_msg: >-
          group_vars/all/main.yml must map vault_dotweave_age_identity onto
          dotweave_age_identity so the role never references a vault_* name.

    - name: Assert ansible.cfg enables the ephemeral ssh-agent and leaves become opt-in
      ansible.builtin.assert:
        that:
          - "ansible_cfg_content is search('ssh_agent = auto')"
          - "ansible_cfg_content is search('vault_password_file = .vault_pass')"
          - "ansible_cfg_content is not search('(?m)^become = true')"
        fail_msg: >-
          ansible.cfg must set ssh_agent = auto (required by ansible_private_key)
          and must not enable become globally.

    - name: Assert yamllint skips the encrypted vault file
      ansible.builtin.assert:
        that:
          - "'inventories/group_vars/all/vault.yml' in yamllint_content"
        fail_msg: .yamllint must ignore inventories/group_vars/all/vault.yml; yamllint cannot parse ciphertext.

    - name: Assert every managed host sits in exactly one static OS group
      ansible.builtin.assert:
        that:
          - >-
            os_groups | map('extract', groups) | map('default', [], true)
            | select('contains', item) | list | length == 1
        fail_msg: >-
          {{ item }} must sit in exactly one of the static OS groups
          ({{ os_groups | join(', ') }}), so that the connection variables in
          group_vars/<group>.yml apply before the first connection.
      loop: "{{ managed_hosts }}"

    - name: Assert localhost stays ungrouped for runtime OS detection
      ansible.builtin.assert:
        that:
          - >-
            os_groups | map('extract', groups) | map('default', [], true)
            | select('contains', 'localhost') | list | length == 0
        fail_msg: >-
          localhost must be classified at runtime by the "Group hosts by OS"
          play, because the control machine may be macOS or Ubuntu.

    - name: Assert runtime OS detection validates the static inventory group
      ansible.builtin.assert:
        that:
          - "'detected_os_group:' in setup_playbook_content"
          - "'groups[detected_os_group]' in setup_playbook_content"
          - "\"inventory_hostname == 'localhost'\" in setup_playbook_content"
          - "setup_playbook_content is search('key:.*detected_os_group')"
        fail_msg: >-
          playbooks/setup.yml must fail before bootstrap roles when a remote
          host's detected OS disagrees with its static inventory group, while
          preserving localhost runtime classification.
