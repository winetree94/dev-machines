---
# Neovim's own build/runtime dependencies on Ubuntu. git is listed even though
# the git role installs it too: these are Neovim's declared prerequisites and
# should not depend on another role having run first. apt is idempotent, so the
# overlap costs nothing.
- name: Neovim | Install Neovim dependencies (apt)
  become: true
  ansible.builtin.apt:
    name: "{{ neovim_dependency }}"
    state: present
  with_items:
    - git
    - make
    - python3-pip
    - xclip
    - wl-clipboard
  loop_control:
    loop_var: neovim_dependency

- name: Neovim | Install Neovim from Homebrew
  ansible.builtin.include_tasks: brew.yml
