- name: Install Dependencies (APT)
  become: true
  when: ansible_os_family == 'Ubuntu'
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  with_items:
    - git
    - make
    - pip
    - xclip
    - wl-clipboard

- name: Install Dependencies (Homebrew)
  community.general.homebrew:
    name: "{{ item }}"
    state: present
  become: false
  with_items:
    - lazygit
    - neovim
    - ripgrep
    - lua
    - luarocks
    - fd
