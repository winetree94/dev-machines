---
# Shared by darwin.yml and debian.yml. lua, luarocks and tree-sitter-cli stay
# here rather than becoming roles of their own: they are Neovim's own runtime
# dependencies, not tools anyone on these machines uses directly. lazygit,
# ripgrep and fd used to be in this list and are now roles in their own right.
- name: Neovim | Install Neovim and its dependencies (brew)
  when: neovim_formula not in (brew_installed_formulae | default([]))
  community.general.homebrew:
    name: "{{ neovim_formula }}"
    state: present
  become: false
  with_items:
    - neovim
    - lua
    - luarocks
    - tree-sitter-cli
  loop_control:
    loop_var: neovim_formula
