---
- name: NVIDIA GPU exporter | Detect the NVIDIA management CLI
  ansible.builtin.command: nvidia-smi --query-gpu=name --format=csv,noheader
  register: nvidia_gpu_exporter_smi_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: NVIDIA GPU exporter | Resolve automatic enablement
  ansible.builtin.set_fact:
    nvidia_gpu_exporter_active: >-
      {{ (monitoring_nvidia_enabled | string | lower == 'auto'
          and nvidia_gpu_exporter_smi_probe.rc == 0)
         or (monitoring_nvidia_enabled | string | lower != 'auto' and monitoring_nvidia_enabled | bool) }}

- name: NVIDIA GPU exporter | Install the checksum-pinned package
  when:
    - nvidia_gpu_exporter_active | bool
    - not ansible_check_mode
  block:
    - name: NVIDIA GPU exporter | Download the official package
      ansible.builtin.get_url:
        url: >-
          {{ 'https://github.com/utkuozdemir/nvidia_gpu_exporter/releases/download/v'
             ~ nvidia_gpu_exporter_version ~ '/nvidia-gpu-exporter_'
             ~ nvidia_gpu_exporter_version ~ '_linux_amd64.deb' }}
        dest: /tmp/nvidia-gpu-exporter.deb
        checksum: "sha256:{{ nvidia_gpu_exporter_deb_checksum }}"
        mode: "0644"
      become: false

    - name: NVIDIA GPU exporter | Install the official package
      ansible.builtin.apt:
        deb: /tmp/nvidia-gpu-exporter.deb
        state: present
      become: true

    - name: NVIDIA GPU exporter | Create the systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/nvidia_gpu_exporter.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: NVIDIA GPU exporter | Bind the service to loopback
      ansible.builtin.copy:
        dest: /etc/systemd/system/nvidia_gpu_exporter.service.d/override.conf
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/nvidia_gpu_exporter --web.listen-address=127.0.0.1:9835 --collect.interval={{ monitoring_scrape_interval }}
          NoNewPrivileges=true
          ProtectSystem=strict
          ProtectHome=true
        owner: root
        group: root
        mode: "0644"
      become: true
      notify: Restart NVIDIA GPU exporter on Linux

    - name: NVIDIA GPU exporter | Enable and start the service
      ansible.builtin.systemd_service:
        name: nvidia_gpu_exporter
        enabled: true
        state: started
        daemon_reload: true
      become: true
