---
# Mirrors the Homebrew package set in default.yml - node itself is managed by
# mise, not installed directly.
- name: Install Node tooling (winget)
  ansible.builtin.include_role:
    name: winget
  vars:
    winget_packages:
      - Oven-sh.Bun
      - pnpm.pnpm
      - DenoLand.Deno
      - BiomeJS.Biome
