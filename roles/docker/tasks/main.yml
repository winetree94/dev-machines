- name: Remove stale Docker GPG key (.gpg)
  when: ansible_facts['distribution'] == 'Ubuntu'
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.gpg
    state: absent
  become: true

- name: Remove stale Docker repository list file
  when: ansible_facts['distribution'] == 'Ubuntu'
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  become: true

- name: Remove conflicting Docker packages
  when: ansible_facts['distribution'] == 'Ubuntu'
  ansible.builtin.apt:
    name: "{{ item }}"
    state: absent
  with_items:
    - docker.io
    - docker-doc
    - docker-compose
    - docker-compose-v2
    - containerd
    - runc
  become: true

- name: Install Docker prerequisites
  when: ansible_facts['distribution'] == 'Ubuntu'
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  with_items:
    - ca-certificates
    - curl
    - gnupg
  become: true

- name: Ensure /etc/apt/keyrings directory exists
  when: ansible_facts['distribution'] == 'Ubuntu'
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Add Docker GPG key
  when: ansible_facts['distribution'] == 'Ubuntu'
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  become: true

- name: Add Docker APT repository
  when: ansible_facts['distribution'] == 'Ubuntu'
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris:
      - https://download.docker.com/linux/ubuntu
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - stable
    architectures:
      - "{{ ansible_facts['architecture'] | replace('x86_64', 'amd64') }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  become: true

- name: Install Docker CE
  when: ansible_facts['distribution'] == 'Ubuntu'
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  with_items:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin
  become: true

- name: Install Distrobox
  when: ansible_facts['distribution'] == 'Ubuntu'
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  with_items:
    - distrobox
  become: true

- name: Install dependencies
  when: ansible_facts['distribution'] == 'Fedora'
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  become: true
  with_items:
    - docker-cli
    - containerd
    - docker-compose
    - docker-compose-switch
