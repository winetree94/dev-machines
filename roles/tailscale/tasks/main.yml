---
- name: Ensure Tailscale keyring directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'
  become: true

- name: Download Tailscale noarmor GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'
  become: true

- name: Add Tailscale stable APT repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types:
      - deb
    uris:
      - "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}"
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - main
    signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
    state: present
  become: true

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
  become: true

- name: Enable and start tailscaled
  when: ansible_facts['service_mgr'] == 'systemd'
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
  become: true
