---
# RustDesk publishes an unattended-Wayland Debian package for x86_64 only. An
# unsupported Ubuntu architecture is deliberately a no-op rather than a fallback
# to the plain `rustdesk` package: the two Debian packages `Conflicts` and
# `Replaces` each other, so a host must stay on exactly one of them.
- name: RustDesk | Install the official Debian package
  when: ansible_facts['architecture'] in rustdesk_linux_packages
  vars:
    rustdesk_linux_archive: /tmp/rustdesk-latest.deb
    rustdesk_debian_package: "{{ rustdesk_linux_packages[ansible_facts['architecture']] }}"
  block:
    - name: RustDesk | Read the installed Debian package state
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - -f=${Status}|${Version}
          - "{{ rustdesk_debian_package }}"
      register: rustdesk_debian_version
      changed_when: false
      failed_when: false
      check_mode: false
      become: false

    # dpkg keeps a removed package's conffiles, so `dpkg-query -W rustdesk` still
    # answers `deinstall ok config-files|<version>` long after an uninstall. Only
    # `install ok installed` proves the package is really present.
    - name: RustDesk | Resolve whether the Debian package is installed
      ansible.builtin.set_fact:
        rustdesk_debian_installed: >-
          {{ (rustdesk_debian_version.stdout | default('') | trim).split('|')[0]
             == 'install ok installed' }}

    - name: RustDesk | Resolve the installed Debian package version
      ansible.builtin.set_fact:
        rustdesk_debian_installed_version: >-
          {{ (rustdesk_debian_version.stdout | default('') | trim).split('|')[-1]
             if rustdesk_debian_installed | bool
             else '' }}

    - name: RustDesk | Read the latest stable release
      ansible.builtin.uri:
        url: https://api.github.com/repos/rustdesk/rustdesk/releases/latest
        headers: "{{ github_api_headers }}"
        return_content: true
      register: rustdesk_release
      check_mode: false
      no_log: true
      when:
        - not (rustdesk_debian_installed | bool)
          or dev_machines_update_mode | bool

    - name: RustDesk | Select the latest Debian package
      ansible.builtin.set_fact:
        rustdesk_latest_version: >-
          {{ rustdesk_release.json.tag_name | regex_replace('^v', '') }}
      when: rustdesk_release is not skipped

    # RustDesk names its packages `<package>-<version>-<arch>.deb`, so select the
    # exact asset rather than a wildcard. A `^rustdesk-.*-x86_64[.]deb$` pattern
    # matches both `rustdesk` and `rustdesk-unattended-wayland`, and taking the
    # first match then alternates between two mutually exclusive packages.
    - name: RustDesk | Select the matching Debian package asset
      ansible.builtin.set_fact:
        rustdesk_debian_asset_matches: >-
          {{ rustdesk_release.json.assets
             | selectattr('name', 'equalto',
                 rustdesk_debian_package ~ '-' ~ rustdesk_latest_version
                 ~ '-' ~ ansible_facts['architecture'] ~ '.deb')
             | list }}
      when: rustdesk_release is not skipped

    - name: RustDesk | Validate the latest package metadata
      ansible.builtin.assert:
        that:
          - rustdesk_debian_asset_matches | length == 1
          - rustdesk_debian_asset_matches[0].digest is match('^sha256:[0-9a-f]{64}$')
        fail_msg: >-
          The latest RustDesk release must publish exactly one
          {{ rustdesk_debian_package }}-{{ rustdesk_latest_version }}-{{ ansible_facts['architecture'] }}.deb
          with a SHA-256 digest.
        quiet: true
      when: rustdesk_release is not skipped

    - name: RustDesk | Record the selected Debian package asset
      ansible.builtin.set_fact:
        rustdesk_latest_asset: "{{ rustdesk_debian_asset_matches[0] }}"
      when: rustdesk_release is not skipped

    - name: RustDesk | Resolve whether installation is needed
      ansible.builtin.set_fact:
        rustdesk_needs_install: >-
          {{ rustdesk_release is not skipped
             and (not (rustdesk_debian_installed | bool)
                  or (rustdesk_debian_installed_version | trim)
                     is version(rustdesk_latest_version, '<')) }}

    - name: RustDesk | Report the pinned package change in check mode
      ansible.builtin.debug:
        msg: >-
          RustDesk {{ rustdesk_latest_version }} would be installed from the official
          checksum-pinned Debian package.
      changed_when: true
      when:
        - ansible_check_mode
        - rustdesk_needs_install | bool

    - name: RustDesk | Install the pinned Debian package
      when:
        - not ansible_check_mode
        - rustdesk_needs_install | bool
      block:
        - name: RustDesk | Download the official Debian package
          ansible.builtin.get_url:
            url: "{{ rustdesk_latest_asset.browser_download_url }}"
            dest: "{{ rustdesk_linux_archive }}"
            checksum: "{{ rustdesk_latest_asset.digest }}"
            mode: "0644"
            timeout: 600
          become: false

        # The unattended-Wayland package declares `Conflicts`/`Replaces` on the
        # plain package, and the apt module's `deb:` path installs through dpkg
        # without resolving that itself. Remove the plain package first; do not
        # purge, so a shared configuration path survives.
        - name: RustDesk | Remove the conflicting plain Debian package
          ansible.builtin.apt:
            name: rustdesk
            state: absent
          become: true
          when: rustdesk_debian_package != 'rustdesk'

        - name: RustDesk | Install the downloaded Debian package
          ansible.builtin.apt:
            deb: "{{ rustdesk_linux_archive }}"
            state: present
            allow_downgrade: false
          become: true

      always:
        - name: RustDesk | Remove the downloaded Debian package
          ansible.builtin.file:
            path: "{{ rustdesk_linux_archive }}"
            state: absent
          become: false

- name: RustDesk | Configure the self-hosted server
  ansible.builtin.include_tasks: configure_unix.yml
  vars:
    rustdesk_cli_path: /usr/bin/rustdesk
    rustdesk_restart_handler: Restart RustDesk on Linux
  when:
    - ansible_facts['architecture'] in rustdesk_linux_packages
    - >-
      not ansible_check_mode
      or (rustdesk_debian_installed is defined
          and rustdesk_debian_installed | bool)
