---
# Shared by darwin.yml and debian.yml: the tap formula carries an on_linux
# block, so this same path works on Ubuntu. It is not tasks/default.yml on
# purpose - default.yml is also the fallback for Windows, which has its own
# winget path and must never reach Homebrew.
- name: Opencode | Tap the opencode formula repository
  ansible.builtin.include_role:
    name: brew_tap
  vars:
    brew_tap_names:
      - anomalyco/tap

# The token stays fully qualified: homebrew-core now carries its own "opencode"
# formula and brew warns that the tap shadows it. The vendor recommends the tap
# and ships releases there first.
- name: Opencode | Install opencode (Homebrew)
  when: "'anomalyco/tap/opencode' not in (brew_installed_formulae | default([]))"
  community.general.homebrew:
    name: anomalyco/tap/opencode
    state: present
  become: false
