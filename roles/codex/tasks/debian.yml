---
# The Homebrew package for Codex is a cask, so it is macOS-only and Linux uses
# the vendor installer. Downloaded and then executed rather than piped into a
# shell, so the fetch and the run stay separate, inspectable steps.
#
# The installer always exits 0 and always rewrites its release link, so the run
# itself cannot tell an upgrade from a no-op - it reports success even when the
# host already runs the resolved version. The installed binary is therefore
# checksummed before and after and the change is reported from that comparison
# (the same pre/post verification the Android role uses), which is what lets a
# converged host stay at changed=0. The stat follows the symlink because
# ~/.local/bin/codex is a link into the versioned standalone release.
- name: Codex | Check whether the Codex CLI is installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/codex"
    checksum_algorithm: sha256
    follow: true
  register: codex_installed
  become: false

- name: Codex | Download the official installer
  when: not codex_installed.stat.exists or dev_machines_update_mode | bool
  ansible.builtin.get_url:
    url: https://chatgpt.com/codex/install.sh
    dest: /tmp/codex-install.sh
    mode: "0755"
    force: true
  become: false

# Run through "setsid --wait" so the installer gets no controlling terminal.
# Ansible's SSH connection hands the task a pty, and the installer opens
# /dev/tty directly - redirecting stdin does not reach it. With a tty present it
# asks "Uninstall the existing brew-managed Codex now? [y/N]" on any host that
# already has a Codex from another package manager, and an Ansible run has
# nobody to answer, so the play hangs forever (measured: 30+ minutes on
# ubuntu-dev). Without a tty the script falls through to its non-interactive
# branch. "--wait" is what keeps the child's exit status, so a failed install
# still fails the task. CODEX_NON_INTERACTIVE is the vendor's documented switch
# and is set as well, belt and braces, since it also covers the "Start Codex
# now?" prompt.
- name: Codex | Install or update the Codex CLI
  when: not codex_installed.stat.exists or dev_machines_update_mode | bool
  ansible.builtin.command:
    argv:
      - setsid
      - --wait
      - /tmp/codex-install.sh
  environment:
    CODEX_NON_INTERACTIVE: "1"
    # The installer appends its "# >>> Codex installer >>>" PATH block to
    # ~/.zshrc whenever its install directory is missing from PATH, and
    # dotweave owns that file: dotweave restores the tracked copy on every run,
    # the installer re-adds the block, and the two never converge. Put the
    # install directory on PATH for the installer instead - it is where the
    # binary lands and what the stat check above looks at - and the installer
    # reports "is already on PATH" and leaves the shell configuration alone.
    PATH: >-
      {{ ansible_facts['env']['HOME'] }}/.local/bin:{{
      ansible_facts['env']['PATH'] }}
  changed_when: false
  become: false

- name: Codex | Verify the Codex CLI is current
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/codex"
    checksum_algorithm: sha256
    follow: true
  register: codex_install_after
  changed_when: >-
    not codex_installed.stat.exists or
    codex_install_after.stat.checksum != codex_installed.stat.checksum
  when: not codex_installed.stat.exists or dev_machines_update_mode | bool
  become: false
