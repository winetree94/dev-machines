---
# Shared system libraries every Ubuntu host here is expected to carry. They are
# not applications, so they are not one role each: nothing installs them for
# itself, and a desktop application built on the host fails to link or falls
# back to a broken tray without them.
#
# - libayatana-appindicator3-1 / gir1.2-ayatanaappindicator3-0.1 - the tray
#   (StatusNotifierItem) runtime and its GObject introspection typelib
# - libayatana-appindicator3-dev / libsecret-1-dev - the headers those and the
#   keyring bind against at build time
# - mesa-utils - glxinfo/glxgears, the only way to tell a working GL stack from
#   a silently software-rendered one
#
# Extend per host through inventories/host_vars/<host>.yml.
desktop_libs_packages:
  - libayatana-appindicator3-1
  - gir1.2-ayatanaappindicator3-0.1
  - libayatana-appindicator3-dev
  - libsecret-1-dev
  - mesa-utils
