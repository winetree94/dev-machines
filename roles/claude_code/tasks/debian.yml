---
- name: Claude code | Install repository prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, gnupg]
    state: present
  become: true

- name: Claude code | Download the official APT signing key
  ansible.builtin.get_url:
    url: https://downloads.claude.ai/keys/claude-code.asc
    dest: /usr/share/keyrings/claude-code.asc
    mode: "0644"
    force: true
  become: true

- name: Claude code | Read the signing-key fingerprint
  ansible.builtin.command:
    argv: [gpg, --show-keys, --with-colons, /usr/share/keyrings/claude-code.asc]
  register: claude_code_key
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Claude code | Verify the official signing key
  ansible.builtin.assert:
    that:
      - "'31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE' in claude_code_key.stdout"
    fail_msg: The Claude Code APT signing key has an unexpected fingerprint.
    quiet: true
  when: not ansible_check_mode

- name: Claude code | Register the official latest APT channel
  ansible.builtin.deb822_repository:
    name: claude-code
    types: [deb]
    uris: https://downloads.claude.ai/claude-code/apt/latest
    suites: [latest]
    components: [main]
    signed_by: /usr/share/keyrings/claude-code.asc
    state: present
  register: claude_code_repository
  become: true

- name: Claude code | Inspect the native-installer launcher
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/claude"
    follow: false
  register: claude_code_native_launcher
  become: false

- name: Claude code | Resolve the native-installer launcher target
  ansible.builtin.command:
    argv:
      - readlink
      - -f
      - "{{ ansible_facts['env']['HOME'] }}/.local/bin/claude"
  register: claude_code_native_target
  changed_when: false
  failed_when: false
  check_mode: false
  when: claude_code_native_launcher.stat.islnk | default(false)
  become: false

- name: Claude code | Install from the official APT repository
  ansible.builtin.apt:
    name: claude-code
    state: "{{ 'latest' if dev_machines_update_mode | bool else 'present' }}"
    update_cache: "{{ claude_code_repository.changed }}"
  become: true
  when: not (ansible_check_mode and claude_code_repository.changed)

- name: Claude code | Report installation from the new APT repository
  ansible.builtin.debug:
    msg: Claude Code would be installed from the official latest APT channel.
  changed_when: true
  when:
    - ansible_check_mode
    - claude_code_repository.changed

- name: Claude code | Remove the superseded native launcher
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/claude"
    state: absent
  when:
    - claude_code_native_launcher.stat.islnk | default(false)
    - >-
      (ansible_facts['env']['HOME'] ~ '/.local/share/claude/versions/')
      in (claude_code_native_target.stdout | default(''))
  become: false
