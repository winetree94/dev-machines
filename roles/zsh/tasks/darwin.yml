---
# macOS ships zsh and it is already the default shell, so there is nothing to
# install - only the explicit shell assignment below, which keeps a host that
# was changed by hand in line with the rest.
- name: Zsh | Set zsh as the default shell
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /bin/zsh
