---
- name: Mise | Install mise (brew)
  when: >-
    'mise' not in (brew_installed_formulae | default([]))
    or (dev_machines_update_mode | bool
        and not (brew_all_upgraded | default(false)))
  community.general.homebrew:
    name: mise
    state: "{{ 'latest' if dev_machines_update_mode | bool else 'present' }}"
  become: false

# mise prints the summary of an upgrade on stdout ("Upgraded 2 tools:") and
# everything else - the resolve progress bars and the "Newer versions are
# available but do not match the configured version ranges" notice - on
# stderr. The old check looked for the absence of two phrases that never
# appear on stdout, so the task reported a change on every update run even
# when every runtime was already current.
- name: Mise | Upgrade managed runtimes
  ansible.builtin.command:
    argv:
      - mise
      - upgrade
  register: mise_runtime_upgrade
  changed_when: "'Upgraded' in mise_runtime_upgrade.stdout"
  when: dev_machines_update_mode | bool
  become: false
