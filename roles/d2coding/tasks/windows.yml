---
- name: D2Coding | Read the latest stable release
  ansible.builtin.uri:
    url: https://api.github.com/repos/naver/d2-coding-font/releases/latest
    return_content: true
  register: d2coding_release
  check_mode: false
  delegate_to: localhost
  become: false

- name: D2Coding | Select the Windows archive
  ansible.builtin.set_fact:
    d2coding_latest_version: >-
      {{ d2coding_release.json.tag_name | regex_replace('^VER', '') }}
    d2coding_latest_asset: >-
      {{ d2coding_release.json.assets
         | selectattr('name', 'match', '^D2Coding-.*[.]zip$') | first }}

- name: D2Coding | Define and validate the latest build
  ansible.builtin.set_fact:
    d2coding_latest_build: >-
      {{ d2coding_latest_asset.name
         | regex_findall('-([0-9]{8})[.]zip$') | first }}

- name: D2Coding | Validate the Windows release metadata
  ansible.builtin.assert:
    that:
      - d2coding_latest_asset.digest is match('^sha256:[0-9a-f]{64}$')
      - d2coding_latest_build is match('^[0-9]{8}$')
    fail_msg: The latest D2Coding archive metadata is incomplete.
    quiet: true

- name: D2Coding | Install from a dynamic local winget manifest
  ansible.builtin.include_role:
    name: winget
  vars:
    winget_local_packages:
      - id: NAVER.D2Coding
        version: "{{ d2coding_latest_version }}"
        display_name: NAVER.D2Coding
        manifest_templates:
          - src: winget/NAVER.D2Coding.installer.yaml.j2
            dest: NAVER.D2Coding.installer.yaml
          - src: winget/NAVER.D2Coding.locale.en-US.yaml.j2
            dest: NAVER.D2Coding.locale.en-US.yaml
          - src: winget/NAVER.D2Coding.yaml.j2
            dest: NAVER.D2Coding.yaml
