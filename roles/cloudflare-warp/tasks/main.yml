---
- name: Ensure /etc/apt/keyrings directory exists
  when: ansible_facts['distribution'] == 'Ubuntu'
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

- name: Download Cloudflare WARP GPG key (ascii-armored)
  when: ansible_facts['distribution'] == 'Ubuntu'
  ansible.builtin.get_url:
    url: https://pkg.cloudflareclient.com/pubkey.gpg
    dest: /tmp/cloudflare-warp-pubkey.asc
    mode: '0644'

- name: Dearmor Cloudflare WARP GPG key
  when: ansible_facts['distribution'] == 'Ubuntu'
  ansible.builtin.shell:
    cmd: gpg --dearmor < /tmp/cloudflare-warp-pubkey.asc > /etc/apt/keyrings/cloudflare-warp.gpg
    creates: /etc/apt/keyrings/cloudflare-warp.gpg
  become: true

- name: Select Cloudflare WARP APT release
  when: ansible_facts['distribution'] == 'Ubuntu'
  ansible.builtin.set_fact:
    cloudflare_warp_apt_release: "{{ 'noble' if ansible_facts['distribution_release'] == 'resolute' else ansible_facts['distribution_release'] }}"

- name: Add Cloudflare WARP APT repository
  when: ansible_facts['distribution'] == 'Ubuntu'
  ansible.builtin.copy:
    content: "deb [signed-by=/etc/apt/keyrings/cloudflare-warp.gpg] https://pkg.cloudflareclient.com/ {{ cloudflare_warp_apt_release }} main\n"
    dest: /etc/apt/sources.list.d/cloudflare-client.list
    mode: '0644'
  become: true

- name: Install cloudflare-warp
  when: ansible_facts['distribution'] == 'Ubuntu'
  ansible.builtin.apt:
    name: cloudflare-warp
    state: present
    update_cache: true
  become: true

- name: Download Cloudflare WARP installer (macOS)
  when: ansible_facts['os_family'] == 'Darwin'
  ansible.builtin.get_url:
    url: https://downloads.cloudflareclient.com/v1/download/macos/ga
    dest: /tmp/cloudflare-warp.pkg
    mode: '0644'

- name: Install Cloudflare WARP (macOS)
  when: ansible_facts['os_family'] == 'Darwin'
  community.general.installp:
    path: /tmp/cloudflare-warp.pkg
    target_volumes: /
    state: present
  become: true
