---
- name: Dotweave | Tap the Tinyrack Homebrew repository
  ansible.builtin.include_role:
    name: brew_tap
  vars:
    brew_tap_names:
      - tinyrack-net/tap

# Both gates name the formula, not the token: "brew list --formula" prints
# tinyrack-net/tap/dotweave as "dotweave", so a qualified comparison never
# matches and the two tasks would both run on every pass.
- name: Dotweave | Install dotweave from Homebrew
  when: "'dotweave' not in (brew_installed_formulae | default([]))"
  community.general.homebrew:
    name: tinyrack-net/tap/dotweave
    state: latest
    update_homebrew: true
  become: false

- name: Dotweave | Upgrade the installed dotweave formula
  when: "'dotweave' in (brew_installed_formulae | default([]))"
  community.general.homebrew:
    name: tinyrack-net/tap/dotweave
    state: latest
    update_homebrew: true
  become: false
