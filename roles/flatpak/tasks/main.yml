---
- name: Install
  become: true
  ansible.builtin.apt:
    name: flatpak
    state: present

- name: Check flathub repository
  become: true
  ansible.builtin.command: "flatpak remotes"
  register: flatpak_remotes_result
  changed_when: false

- name: Regitser flathub repository
  when: "'flathub' not in flatpak_remotes_result.stdout"
  become: true
  ansible.builtin.command: "flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo"
  changed_when: true

- name: Install Gnome Software
  when: gui | bool
  become: true
  ansible.builtin.apt:
    name: "{{ item.name }}"
    state: "{{ item.state }}"
  with_items:
    - name: gnome-software
      state: present
    - name: gnome-software-plugin-flatpak
      state: present
    - name: gnome-software-plugin-snap
      state: present

# One-shot inventory of the Flatpak applications already installed, so the 20
# GUI roles that install from Flathub can answer "is it there?" from a fact.
# community.general.flatpak runs a full "flatpak list --system" inside every
# single invocation, so without this the same listing is produced 20 times.
#
# --system matches the module's default method. A host where the listing fails
# yields an empty list and every consuming role falls through to its own module
# call exactly as before - slower, never wrong.
- name: Flatpak | List the installed applications
  become: true
  ansible.builtin.command: flatpak list --system --app --columns=application
  register: flatpak_app_list
  changed_when: false
  failed_when: false
  check_mode: false

- name: Flatpak | Remember the installed application IDs
  ansible.builtin.set_fact:
    flatpak_installed_ids: >-
      {{ flatpak_app_list.stdout_lines | map('trim') | reject('equalto', '') | list
         if flatpak_app_list.rc == 0 else [] }}
