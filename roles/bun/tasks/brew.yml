---
# Shared by darwin.yml and debian.yml - the tap formula has a Linux build, so
# the same path works on Ubuntu. Not tasks/default.yml, which would also be the
# Windows fallback.
#
# homebrew-core now carries its own "bun" formula at the same version, but
# Bun's own documentation points at this tap, so the token stays fully
# qualified and the tap stays - the same call made for anomalyco/tap/opencode.
- name: Bun | Tap the Bun repository
  ansible.builtin.include_role:
    name: brew_tap
  vars:
    brew_tap_names:
      - oven-sh/bun

- name: Bun | Install Bun (brew)
  when: "'oven-sh/bun/bun' not in (brew_installed_formulae | default([]))"
  community.general.homebrew:
    name: oven-sh/bun/bun
    state: present
  become: false
