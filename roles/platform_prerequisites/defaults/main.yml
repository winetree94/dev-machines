---
# Non-application packages that form the Ubuntu development baseline. They are
# deliberately not gated on `gui`: software built or run on a headless or WSL
# host can still link against these libraries.
platform_prerequisites_ubuntu_packages:
  - libayatana-appindicator3-1
  - gir1.2-ayatanaappindicator3-0.1
  - libayatana-appindicator3-dev
  - libsecret-1-dev
  - mesa-utils
  - nethogs
  - iotop-c

# Compatibility alias for existing host_vars overrides. New configuration
# should prefer platform_prerequisites_ubuntu_packages; an explicitly defined
# desktop_libs_packages still wins because inventory variables outrank defaults.
desktop_libs_packages: "{{ platform_prerequisites_ubuntu_packages }}" # noqa var-naming[no-role-prefix]

# Ubuntu desktop integration packages that have no purpose on headless or WSL
# guests. The Ubuntu bootstrap finalises `gui` before this role runs.
platform_prerequisites_ubuntu_gui_packages:
  - gnome-browser-connector
  - gir1.2-gtop-2.0
  - gnome-tweaks
