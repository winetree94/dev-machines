---
- name: Winget | Resolve local manifest package state
  ansible.builtin.set_fact:
    winget_local_matching_packages: >-
      {{ winget_arp_installed_packages
         | selectattr(
             'display_name', 'match',
             winget_local_package.display_name_regex
             | default('^' ~ winget_local_package.display_name | regex_escape ~ '$')
           )
         | list }}

- name: Winget | Check the local manifest completion marker
  ansible.windows.win_stat:
    path: "{{ winget_local_package.marker_path }}"
  register: winget_local_marker
  when: winget_local_package.marker_path is defined

- name: Winget | Resolve exact local manifest package state
  ansible.builtin.set_fact:
    winget_local_exact_packages: >-
      {{ winget_local_matching_packages
         | selectattr(
             'display_version', 'match',
             winget_local_package.arp_version_regex
             | default(
                 '^'
                 ~ (winget_local_package.arp_version
                    | default(winget_local_package.version) | string
                    | regex_escape)
                 ~ '$'
               )
           )
         | list }}
    winget_local_marker_present: >-
      {{ winget_local_marker.stat.exists | default(false) | bool }}

- name: Winget | Report local manifest package change in check mode
  ansible.builtin.debug:
    msg: >-
      {{ winget_local_package.id }} {{ winget_local_package.version }} would be
      {{ 'installed' if winget_local_matching_packages | length == 0 else 'upgraded' }}
      from its local winget manifest.
  changed_when: true
  when:
    - ansible_check_mode
    - winget_local_exact_packages | length == 0
    - not (winget_local_marker_present | bool)

- name: Winget | Apply local manifest package
  when:
    - not ansible_check_mode
    - winget_local_exact_packages | length == 0
    - not (winget_local_marker_present | bool)
  block:
    - name: Winget | Resolve local manifest upgrade options
      ansible.builtin.set_fact:
        winget_local_force_upgrade_option: >-
          {{ '--force'
             if (winget_local_matching_packages | length > 0
                 and winget_local_package.force_upgrade | default(false) | bool)
             else '' }}

    - name: Winget | Create a temporary local manifest directory
      ansible.windows.win_tempfile:
        state: directory
        suffix: -winget-manifest
      register: winget_local_manifest_temp

    - name: Winget | Copy the local manifest to the Windows host
      ansible.windows.win_copy:
        src: "{{ winget_local_package.manifest_source }}/"
        dest: "{{ winget_local_manifest_temp.path }}\\"
      when: winget_local_package.manifest_source is defined

    - name: Winget | Render the dynamic local manifest
      ansible.windows.win_template:
        src: "{{ winget_manifest_template.src }}"
        dest: >-
          {{ winget_local_manifest_temp.path }}\{{ winget_manifest_template.dest }}
      loop: "{{ winget_local_package.manifest_templates | default([]) }}"
      loop_control:
        loop_var: winget_manifest_template
        label: "{{ winget_manifest_template.dest }}"

    # App Installer updates rewrite %LOCALAPPDATA%\Microsoft\WindowsApps\winget.exe
    # in place. A run that overlaps the replacement dies with "Program
    # 'winget.exe' failed to run: Access is denied" - the same lock class as the
    # installer race below, not a broken manifest - so retry rather than fail
    # the host and skip every role after it.
    - name: Winget | Validate the local package manifest
      ansible.windows.win_shell: >-
        winget validate --manifest "{{ winget_local_manifest_temp.path }}"
        --disable-interactivity
      register: winget_local_manifest_validate
      changed_when: false
      until: winget_local_manifest_validate.rc == 0
      retries: 3
      delay: 10

    - name: Winget | Install or upgrade from the local manifest
      ansible.windows.win_shell: >-
        winget {{ 'install' if winget_local_matching_packages | length == 0 else 'upgrade' }}
        --manifest "{{ winget_local_manifest_temp.path }}" --silent
        {{ winget_local_force_upgrade_option }}
        --disable-interactivity --accept-package-agreements
      register: winget_local_install
      until: >-
        winget_local_install.rc == 0
        or 'Font already installed.' in winget_local_install.stdout
        or 'No installed package found matching input criteria.'
           in winget_local_install.stdout
      retries: 2
      delay: 10
      failed_when:
        - winget_local_install.rc != 0
        - "'Font already installed.' not in winget_local_install.stdout"
        - "'No installed package found matching input criteria.' not in winget_local_install.stdout"
      changed_when: winget_local_install.rc == 0

    # A RustDesk MSI upgrade rotates its product code, so winget cannot match the
    # new manifest against the old install ("No installed package found matching
    # input criteria.") and falls through to this path. Remove the old MSI by the
    # product code carried in its Add/Remove Programs UninstallString. `--name`
    # cannot be used: the vendor MSI also registers a key under the bare
    # DisplayName, so `--name --exact` dies with "Multiple installed packages
    # found matching input criteria." An absorbed failure is fine - the install
    # below is the safety net, and the vendor MSI's own major upgrade removes any
    # product this loop could not.
    - name: Winget | Resolve the MSI product codes of the existing ARP packages
      ansible.builtin.set_fact:
        winget_local_product_codes: >-
          {{ winget_local_matching_packages
             | map(attribute='uninstall_string', default='')
             | map('regex_findall', '[{][0-9A-Fa-f-]{36}[}]')
             | flatten
             | map('upper')
             | unique
             | list }}
      when:
        - winget_local_install.rc != 0
        - "'No installed package found matching input criteria.' in winget_local_install.stdout"

    - name: Winget | Remove existing ARP packages winget cannot match by product code
      ansible.windows.win_shell: >-
        winget uninstall --product-code "{{ winget_local_product_code }}" --silent
        --disable-interactivity
      loop: "{{ winget_local_product_codes | default([]) }}"
      loop_control:
        loop_var: winget_local_product_code
        label: "{{ winget_local_product_code }}"
      register: winget_local_product_code_uninstall
      changed_when: false
      failed_when: false
      when:
        - winget_local_install.rc != 0
        - "'No installed package found matching input criteria.' in winget_local_install.stdout"

    - name: Winget | Report product-code removals that did not succeed
      ansible.builtin.debug:
        msg: >-
          winget could not remove
          {{ winget_local_uninstall.winget_local_product_code }} by product code
          (rc={{ winget_local_uninstall.rc }}):
          {{ winget_local_uninstall.stdout | default('') | trim }}
      loop: "{{ winget_local_product_code_uninstall.results | default([]) }}"
      loop_control:
        loop_var: winget_local_uninstall
        label: "{{ winget_local_uninstall.winget_local_product_code | default('unknown') }}"
      changed_when: false
      when: winget_local_uninstall.rc | default(0) != 0

    - name: Winget | Reinstall when the existing ARP entry was not linked to winget
      ansible.windows.win_shell: >-
        winget install --manifest "{{ winget_local_manifest_temp.path }}" --silent
        --disable-interactivity --accept-package-agreements
      register: winget_local_fallback_install
      until: >-
        winget_local_fallback_install.rc == 0
        or 'Font already installed.' in winget_local_fallback_install.stdout
      retries: 2
      delay: 10
      failed_when:
        - winget_local_fallback_install.rc != 0
        - "'Font already installed.' not in winget_local_fallback_install.stdout"
      changed_when: winget_local_fallback_install.rc == 0
      when:
        - winget_local_install.rc != 0
        - "'No installed package found matching input criteria.' in winget_local_install.stdout"

    - name: Winget | Add the applied package to the in-memory ARP snapshot
      ansible.builtin.set_fact:
        winget_arp_installed_packages: >-
          {{ winget_arp_installed_packages + [{
               'display_name': winget_local_package.display_name,
               'display_version': winget_local_package.arp_version
                 | default(winget_local_package.version),
               'publisher': ''
             }] }}

    - name: Winget | Write the local manifest completion marker
      ansible.windows.win_file:
        path: "{{ winget_local_package.marker_path }}"
        state: touch
      when: winget_local_package.marker_path is defined

  always:
    - name: Winget | Remove the temporary local manifest directory
      ansible.windows.win_file:
        path: "{{ winget_local_manifest_temp.path }}"
        state: absent
      when:
        - winget_local_manifest_temp is defined
        - winget_local_manifest_temp.path is defined
