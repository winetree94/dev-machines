---
# Shared Windows package installer. Include it from a role's windows.yml with
# the winget package IDs to install:
#
#   - name: Install Docker Desktop (winget)
#     ansible.builtin.include_role:
#       name: winget
#     vars:
#       winget_packages:
#         - Docker.DockerDesktop
#
# Including it with no `winget_packages` runs only the availability assert
# below, which is how the "Windows bootstrap" play uses it.
#
# winget decides what is installed from the Add/Remove Programs registry, so
# unlike Chocolatey it recognises software installed by any other means. That
# is the whole reason this repository uses it: choco only tracks its own
# installs and dies with a generic MSI 1603 when it tries to lay a package
# over an install it did not make.
#
# Community packages stay pinned to "--source winget". Callers that need an
# official Microsoft Store package pass its product ID through the separate
# `winget_msstore_packages` list; those calls pin "--source msstore" and accept
# both source and package agreements non-interactively.
# Vendors without either source can be managed through `winget_local_packages`.
# Those callers provide a checked-in, checksum-pinned multi-file manifest and
# an Add/Remove Programs identity; local.yml keeps that path inside winget too.

# winget ships with Windows 10 1809+ and Windows 11 as part of the App
# Installer package, so there is nothing to bootstrap - unlike Chocolatey and
# Scoop, which this repository used to install itself. Fail early and clearly
# if it is somehow missing, rather than letting every package role fail one by
# one further into the run. The `winget_available` fact keeps the check to one
# WinRM round trip per host, not one per including role.
- name: Winget | Check that winget is available
  ansible.windows.win_shell: winget --version
  register: winget_version
  changed_when: false
  failed_when: false
  check_mode: false
  when: not (winget_available | default(false))

- name: Winget | Assert that winget is available
  ansible.builtin.assert:
    that:
      - winget_version.rc == 0
    fail_msg: >-
      winget was not found on this host. It ships with Windows 10 1809+ and
      Windows 11 as the "App Installer" package - install or update App
      Installer from the Microsoft Store, then re-run.
    quiet: true
  when: not (winget_available | default(false))

- name: Winget | Remember that winget was verified on this host
  ansible.builtin.set_fact:
    winget_available: true

# Installed state is answered from a single per-host export rather than one
# "winget list" per package - see snapshot.yml for why that round trip is the
# dominant cost of a Windows run. Guarded the same way as winget_available
# above, so it costs one round trip per host rather than one per including role.
- name: Winget | Snapshot the installed packages
  ansible.builtin.include_tasks: snapshot.yml
  when: winget_installed_ids is not defined

- name: Winget | Snapshot the installed Microsoft Store packages
  ansible.builtin.include_tasks: snapshot_msstore.yml
  when:
    - winget_msstore_packages | length > 0
    - winget_msstore_installed_ids is not defined

- name: Winget | Manage packages from local manifests
  ansible.builtin.include_tasks: local.yml
  when: winget_local_packages | length > 0

# Only the packages the snapshot could not vouch for. An export lists a package
# only while the source still carries a matching manifest, so anything missing
# from it falls through to the per-package check below and behaves exactly as
# it did before - slower for that one package, never wrong.
- name: Winget | Confirm the packages the snapshot did not account for
  vars:
    winget_unaccounted: >-
      {{ winget_packages | reject('in', winget_installed_ids) | list }}
  ansible.windows.win_shell: >-
    winget list --id {{ item }} --exact --source winget
    --accept-source-agreements
  register: winget_present
  loop: "{{ winget_unaccounted }}"
  # rc 0 means installed; a missing package returns -1978335212
  # (0x8A150014, APPINSTALLER_CLI_ERROR_NO_APPLICATIONS_FOUND).
  changed_when: false
  failed_when: false
  check_mode: false

# Retried because a first install attempt fails intermittently on a freshly
# downloaded installer: RedisInsight.RedisInsight died with exit code
# 3221225477 (0xC0000005, access violation) right after "Successfully verified
# installer hash", and the identical command succeeded seconds later once
# winget had the installer cached. That signature - a crash only on the run that
# also downloads - is a race against on-access antivirus scanning, not a broken
# package, so it must not fail the host and skip every role after it. A genuine
# failure (wrong ID, unsupported install technology) still fails, just three
# attempts later.
- name: Winget | Install missing packages
  ansible.windows.win_shell: >-
    winget install --id {{ item.item }} --exact --source winget --silent
    --disable-interactivity --accept-source-agreements
    --accept-package-agreements
  # default([]) because the task above is skipped outright when the snapshot
  # accounted for every package, and a skipped loop registers no "results".
  loop: "{{ winget_present.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  register: winget_install
  until: winget_install is succeeded
  retries: 2
  delay: 10
  changed_when: true

# Store packages mirror the community-source flow above, but keep their own
# snapshot and explicit source because Store product IDs are a separate
# namespace and require agreement handling.
- name: Winget | Confirm Microsoft Store packages not in the snapshot
  vars:
    winget_msstore_unaccounted: >-
      {{ winget_msstore_packages
         | reject('in', winget_msstore_installed_ids | default([])) | list }}
  ansible.windows.win_shell: >-
    winget list --id {{ item }} --exact --source msstore
    --accept-source-agreements
  register: winget_msstore_present
  loop: "{{ winget_msstore_unaccounted }}"
  changed_when: false
  failed_when: false
  check_mode: false

- name: Winget | Install missing Microsoft Store packages
  ansible.windows.win_shell: >-
    winget install --id {{ item.item }} --exact --source msstore --silent
    --disable-interactivity --accept-source-agreements
    --accept-package-agreements
  loop: "{{ winget_msstore_present.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  register: winget_msstore_install
  until: winget_msstore_install is succeeded
  retries: 2
  delay: 10
  changed_when: true
