---
# The "Windows bootstrap" play includes this role with no packages, purely for
# the availability assert in tasks/main.yml.
winget_packages: []

# Enabled only by the Windows bootstrap include. Package roles leave this off
# so an update filtered by an application tag upgrades only that application.
winget_global_update: false

# Most roles only ensure that a package is installed. Callers that require a
# current file or repository format can opt specific community packages into
# an exact-source upgrade check on every run.
winget_upgrade_packages: []

# Microsoft Store product IDs are kept separate so every lookup and install
# pins the correct source instead of relying on winget's source resolution.
winget_msstore_packages: []

# Packages whose vendor publishes a Windows installer but which have no
# community or Microsoft Store source manifest yet. Each item points at a
# controller-side directory containing a complete multi-file winget manifest
# and declares the Add/Remove Programs identity used for idempotency.
winget_local_packages: []
