---
# Shared by darwin.yml and debian.yml - the formula has a Linux bottle, so the
# same path works on Ubuntu. It is not tasks/default.yml on purpose:
# default.yml is also the dispatcher's fallback on Windows, which has its own
# winget path and must never reach Homebrew.
- name: Flux | Tap the Flux CD repository
  ansible.builtin.include_role:
    name: brew_tap
  vars:
    brew_tap_names:
      - fluxcd/tap

# The gate names the formula, not the token: "brew list --formula" prints
# fluxcd/tap/flux as "flux", so a qualified comparison never matches and the
# module would run on every pass.
- name: Flux | Install the Flux CLI (brew)
  when: "'flux' not in (brew_installed_formulae | default([]))"
  community.general.homebrew:
    name: fluxcd/tap/flux
    state: present
  become: false
