---
- name: Android | Assert the Linux architecture is supported
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] == 'x86_64'
    fail_msg: >-
      Google's Android SDK Command-line Tools support Linux x86_64 only;
      {{ ansible_facts['architecture'] }} cannot be managed by this role.
    quiet: true

- name: Android | Install the archive extractor
  ansible.builtin.apt:
    name: unzip
    state: present
  become: true

- name: Android | Define the Linux SDK installation
  ansible.builtin.set_fact:
    android_sdk_root_effective: >-
      {{ android_sdk_root | default(ansible_facts['env']['HOME'] ~ '/Android/Sdk', true) }}
    android_cmdline_tools_url: >-
      https://dl.google.com/android/repository/commandlinetools-linux-{{
      android_cmdline_tools_version }}_latest.zip
    android_cmdline_tools_checksum: >-
      sha256:{{ android_cmdline_tools_checksums['linux_x86_64'] }}

- name: Android | Install the SDK
  ansible.builtin.include_tasks: unix.yml

# The repository used to install Ubuntu's older platform-tools package. Keep
# it until the official sdkmanager copy has landed, then remove the duplicate
# so the user-managed shell path has one SDK source of truth.
- name: Android | Remove the superseded Ubuntu Platform Tools
  ansible.builtin.apt:
    name: android-sdk-platform-tools
    state: absent
  become: true
  when: android_cmdline_tools_ready | bool
