---
# Official ChatGPT desktop app (Codex) APT repository, Linux preview:
# https://learn.chatgpt.com/docs/linux/linux-app
#
# OpenAI publishes the repository's signing key only inside the .deb itself
# (base64 in the postinst), never at a stable URL - every guessed path under
# persistent.oaistatic.com answers 404 - so the key is fetched by fingerprint
# instead. keyserver.ubuntu.com serves the full public key and verifies the
# repository's InRelease; the keys.openpgp.org copy of the same fingerprint is
# stripped and cannot be used. Key: "Codex Linux Repository"
# 3BFA0E4AE8B8CC16A2D9BA684A3B4A566C4660E4.

- name: ChatGPT Desktop | Ensure the keyring directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"
  become: true

- name: ChatGPT Desktop | Read the installed signing key
  ansible.builtin.stat:
    path: /usr/share/keyrings/chatgpt-archive-keyring.asc
  register: chatgpt_desktop_keyring
  become: false

- name: ChatGPT Desktop | Download the APT signing key
  ansible.builtin.get_url:
    url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x3BFA0E4AE8B8CC16A2D9BA684A3B4A566C4660E4&options=mr"
    dest: /usr/share/keyrings/chatgpt-archive-keyring.asc
    mode: "0644"
  become: true
  # get_url probes the URL with HEAD under --check, and the Hockeypuck software
  # behind keyserver.ubuntu.com answers HEAD with 405 - the download itself is
  # a plain GET and works, so only a dry run hits this. Skipping it there keeps
  # "make check" honest: a real run is the only thing that writes into
  # /usr/share/keyrings, and the report below still shows the pending change.
  when: not ansible_check_mode

- name: ChatGPT Desktop | Report the signing key download in check mode
  ansible.builtin.debug:
    msg: >-
      The ChatGPT Desktop signing key would be fetched from
      keyserver.ubuntu.com by fingerprint into
      /usr/share/keyrings/chatgpt-archive-keyring.asc.
  changed_when: true
  when:
    - ansible_check_mode
    - not chatgpt_desktop_keyring.stat.exists

- name: ChatGPT Desktop | Disable the package-managed APT repository
  ansible.builtin.lineinfile:
    path: /etc/default/chatgpt
    regexp: '^repo_add_once='
    line: 'repo_add_once="false"'
    create: true
    mode: "0644"
  become: true

- name: ChatGPT Desktop | Remove the package-managed duplicate repository
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/chatgpt.sources
    state: absent
  become: true

- name: ChatGPT Desktop | Add the official APT repository
  ansible.builtin.deb822_repository:
    name: chatgpt-desktop
    types:
      - deb
    uris:
      - https://persistent.oaistatic.com/codex-app-prod/linux/deb
    suites:
      - stable
    components:
      - main
    signed_by: /usr/share/keyrings/chatgpt-archive-keyring.asc
    state: present
  become: true

- name: ChatGPT Desktop | Install ChatGPT with Codex
  ansible.builtin.apt:
    name: chatgpt
    state: present
    update_cache: true
  become: true
