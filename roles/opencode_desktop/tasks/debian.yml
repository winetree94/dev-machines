---
- name: OpenCode Desktop | Inspect the legacy Debian package
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --show
      - "--showformat=${db:Status-Status}"
      - opencode
  register: opencode_desktop_debian_status
  changed_when: false
  failed_when: false
  check_mode: false
  become: false

- name: OpenCode Desktop | Install from Flathub
  community.general.flatpak:
    name: ai.opencode.opencode
    state: >-
      {{ 'latest'
         if dev_machines_update_mode | bool
            and not (flatpak_all_upgraded | default(false))
         else 'present' }}
  become: true
  when: >-
    'ai.opencode.opencode' not in (flatpak_installed_ids | default([]))
    or (dev_machines_update_mode | bool
        and not (flatpak_all_upgraded | default(false)))

- name: OpenCode Desktop | Remove the superseded Debian package
  ansible.builtin.apt:
    name: opencode
    state: absent
  become: true
  when: opencode_desktop_debian_status.stdout | trim == 'installed'
