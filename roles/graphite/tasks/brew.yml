---
# Shared by darwin.yml and debian.yml. Not tasks/default.yml: default.yml is
# also the dispatcher's fallback on Windows, and graphite has no winget package
# to fall back from.
#
# Homebrew 6 refuses to load anything from an untrusted third-party tap.
- name: Graphite | Tap the Graphite repository
  community.general.homebrew_tap:
    name: withgraphite/tap
    state: present
    trust: true
  become: false

- name: Graphite | Install the Graphite CLI (brew)
  when: "'withgraphite/tap/graphite' not in (brew_installed_formulae | default([]))"
  community.general.homebrew:
    name: withgraphite/tap/graphite
    state: present
  become: false
