---
# Connection identity only. Every credential comes from
# inventories/group_vars/all/vault.yml via a vault_* reference.
#
# Remote hosts MUST sit in a static OS group: the connection settings in
# group_vars/<group>.yml (ansible_shell_type, ansible_become_method) have to
# be known *before* the first connection, so the runtime "Group hosts by OS"
# play in playbooks/setup.yml is too late for them.
#
# localhost is deliberately left ungrouped - the control machine may be
# macOS, Linux or Windows, so it is classified at runtime instead.
all:
  # hosts:
  #   localhost:
  #     ansible_connection: local
  #     ansible_become_password: "{{ vault_localhost_become_password }}"
  children:
    ubuntu:
      hosts:
        ubuntu-dev:
          ansible_host: 10.132.247.36
          ansible_user: "{{ vault_ubuntu_dev_username }}"
          ansible_become_password: "{{ vault_ubuntu_dev_become_password }}"
        e14:
          ansible_host: 10.8.0.6
          ansible_user: "{{ vault_ubuntu_dev_username }}"
          ansible_become_password: "{{ vault_ubuntu_dev_become_password }}"
    macos:
      hosts:
        mbp:
          ansible_host: 10.8.0.5
          ansible_user: "{{ vault_macmini_username }}"
          ansible_become_password: "{{ vault_macmini_become_password }}"
    windows:
      hosts:
        desktop:
          ansible_host: 10.132.247.31
          ansible_user: "{{ vault_desktop_username }}"
          ansible_become_password: "{{ vault_desktop_become_password }}"
