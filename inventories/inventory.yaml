---
# Hosts are automatically assigned to the ubuntu / macos / windows groups
# at runtime (see the "Group hosts by OS" play in playbooks/setup.yml).
# Add remote hosts to a static OS group below so that the connection
# variables from inventories/group_vars/<group>.yml apply before connecting.
all:
  hosts:
    localhost:
      ansible_connection: local
  children:
    ubuntu:
      hosts: {}
    macos:
      hosts: {}
    windows:
      hosts: {}
