---
# GUI default. Overridden to true by group_vars/macos.yml and
# group_vars/windows.yml, and by the desktop-detection set_fact in the
# "Ubuntu bootstrap" play. Defined here so that hosts which are only sorted
# into an OS group at runtime (localhost, via the "Group hosts by OS" play)
# still have a defined value during the first play.
gui: false

# setup.yml only installs missing software. playbooks/update.yml overrides this
# to make package-manager and direct-download roles converge installed software
# to the latest available release as well.
dev_machines_update_mode: false

# VPN default. Set to false for WSL guests by the "Group hosts by OS" play,
# which is why it is a plain var here rather than a set_fact: an `-e vpn=true`
# on the command line still wins over that runtime override.
vpn: true

# Homebrew is not on the default non-interactive PATH on macOS or Linux. Build
# the task environment from the gathered OS facts so cross-OS plays apply it
# automatically on POSIX hosts and pass an empty mapping on Windows. The inline
# conditional is lazy, so Windows never evaluates its differently-cased PATH
# fact while producing the empty branch.
homebrew_environment: >-
  {{
    {
      'PATH':
        '/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:'
        ~ ansible_facts['env']['PATH']
    }
    if ansible_facts['os_family'] != 'Windows'
    else {}
  }}

# --- vault indirection -------------------------------------------------
# Every secret lives in ./vault.yml (ansible-vault, one password).
# Roles and playbooks must never reference a vault_* name directly.
#
# ansible_private_key holds the key *contents*, which ansible loads into an
# ephemeral ssh-agent for the run - it requires "ssh_agent = auto" under
# [connection] in ansible.cfg and never writes the key to disk.
ansible_private_key: "{{ vault_ssh_private_key }}"

# Authenticate public GitHub API reads so update runs use the account-scoped
# rate limit rather than each target host's small anonymous IP-based limit.
github_api_token: "{{ vault_github_api_token }}"
github_api_headers:
  Accept: application/vnd.github+json
  Authorization: "Bearer {{ github_api_token }}"
  X-GitHub-Api-Version: "2022-11-28"

# Dotweave reads this age identity only while bootstrapping a host. The role
# writes it to a mode-0600 temporary file for `dotweave init --key-file` and
# deletes that file in an always block; the durable copy is Dotweave's own
# keys.txt outside this repository.
dotweave_age_identity: "{{ vault_dotweave_age_identity }}"

# Host hardware monitoring. The dedicated bearer token remains in the
# repository's single encrypted vault.
monitoring_enabled: true
monitoring_otlp_endpoint: https://telemetry.winetree94.com
monitoring_scrape_interval: 30s
monitoring_fleet_label: dev-machines
monitoring_nvidia_enabled: auto
monitoring_smart_enabled: true
monitoring_sensor_bridge_enabled: true
telemetry_token: "{{ vault_dev_machines_telemetry_token }}"
