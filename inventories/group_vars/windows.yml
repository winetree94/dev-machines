---
# Windows hosts are managed over OpenSSH (Windows optional feature).
# See readme.md for the one-time manual host preparation.
#
# ansible_user and ansible_become_password come from inventories/hosts.yml,
# which sources them from group_vars/all/vault.yml. runas needs the
# interactive account password of ansible_user - for a Microsoft Account that
# is the MSA password, and a Windows Hello PIN will not work.
ansible_connection: ssh
ansible_shell_type: powershell
ansible_become_method: runas
ansible_become_user: "{{ ansible_user }}"
gui: true

# WinRM alternative:
# ansible_connection: winrm
# ansible_winrm_transport: ntlm
# ansible_port: 5986
